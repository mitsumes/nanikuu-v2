<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？ - 自分だけのグルメ手帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#121212', card: '#1e1e1e', input: '#2d2d2d', border: '#3f3f46', text: '#f3f4f6', muted: '#9ca3af' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 15px rgba(249, 115, 22, 0.6); transform: scale(1); }
            50% { text-shadow: 0 0 30px rgba(249, 115, 22, 0.9); transform: scale(1.03); }
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(249, 115, 22, 0.7); }
        }
        @keyframes popPin {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(-45deg); opacity: 1; }
            100% { transform: scale(1) rotate(-45deg); opacity: 1; }
        }
        @keyframes shockwave {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        @keyframes badgePop {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .anim-title { animation: pulseGlow 2s ease-in-out infinite; }
        .anim-icon { animation: floatIcon 1.5s ease-in-out infinite; }
        .anim-start-btn { animation: pulseBtn 2s ease-in-out infinite; }
        .dropped-pin { animation: popPin 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .badge-anim { animation: badgePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .pin-shockwave {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(249, 115, 22, 0.7);
            transform: translate(-50%, -50%) scale(0.2);
            animation: shockwave 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 5;
        }
        
        body { background-color: #121212; color: #f3f4f6; }

        #map {
            width: 100%;
            height: 420px;
            border-radius: 1.5rem; /* 角丸を強調 */
            z-index: 1;
            background-color: #1e1e1e;
            border: 4px solid white; /* 枠線を白く太く */
        }

        /* Leafletのポップアップスタイルをダークモードに調整 */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1e1e1e;
            color: #f3f4f6;
        }
        .leaflet-popup-content {
            margin: 10px;
        }
        .leaflet-container a.leaflet-popup-close-button {
            color: #9ca3af;
        }
        .leaflet-container a.leaflet-popup-close-button:hover {
            color: #f3f4f6;
        }

        /* Leafletのコントロールボタン（+ / -）をダークモードに調整 */
        .leaflet-bar a, .leaflet-bar a:hover {
            background-color: #1e1e1e;
            color: #f3f4f6;
            border-bottom: 1px solid #3f3f46;
        }
        .leaflet-bar a.leaflet-disabled {
            background-color: #2d2d2d;
            color: #9ca3af;
        }

    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- オープニング画面 -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-dark-bg flex flex-col items-center justify-center p-6 text-center transition-opacity duration-700">
        <div class="space-y-6 max-w-sm w-full flex flex-col items-center">
            <div class="inline-block text-orange-500 text-5xl anim-icon mb-2">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <div class="space-y-2">
                <h1 class="text-3xl font-black tracking-widest text-white anim-title">なにクウ？</h1>
                <p class="text-xs text-orange-400 font-bold tracking-wider uppercase border-t border-b border-orange-500/30 py-1 inline-block px-4">- 日本全国 都道府県開拓手帳 -</p>
            </div>
            <p class="text-xs text-dark-muted">お店を登録して、お気に入りの場所を地図に残そう！</p>
            <div class="pt-6">
                <button onclick="closeSplashScreen()" class="anim-start-btn group bg-gradient-to-b from-orange-500 to-amber-600 hover:from-orange-400 hover:to-amber-500 text-white w-28 h-28 rounded-full shadow-2xl flex flex-col items-center justify-center border-4 border-amber-300/60 transition transform active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-bowl-food text-3xl mb-1 text-amber-100"></i>
                    <span class="text-xs font-black tracking-widest uppercase text-amber-100">START</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="bg-dark-card border-b border-dark-border sticky top-0 z-40 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-utensils text-orange-500 text-xl"></i>
                <h1 class="text-lg font-bold tracking-wider">なにクウ？ <span class="text-xs bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-full border border-orange-500/30">グルメマップ</span></h1>
            </div>
            <div class="flex items-center space-x-2 bg-dark-input px-3 py-1.5 rounded-full border border-dark-border text-sm">
                <i class="fa-solid fa-user text-orange-400"></i>
                <span id="display-username" class="font-medium max-w-[100px] truncate">ゲスト</span>
                <button onclick="changeUsername()" class="text-dark-muted hover:text-white transition"><i class="fa-solid fa-pen text-xs"></i></button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- 地図セクション -->
        <section class="bg-dark-card border border-dark-border rounded-2xl p-4 sm:p-6 shadow-xl relative overflow-hidden">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-map-marked-alt text-orange-400 text-lg"></i>
                        <h2 class="font-bold text-base text-white">みんなの開拓マップ</h2>
                    </div>
                    <span id="exploration-rate" class="text-xs bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2.5 py-1 rounded-full font-bold">登録スポット: 0件</span>
                </div>
                
                <div class="relative rounded-2xl overflow-hidden shadow-inner">
                    <div id="map"></div>
                    <!-- クラウドレイヤーとオーバーレイは削除しました -->
                </div>
            </div>
        </section>

        <!-- 飲食店リスト -->
        <div class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-dark-muted uppercase tracking-wider">登録されたお店 (<span id="shop-count">0</span>件)</h2>
            </div>
            
            <div id="loading-spinner" class="text-center py-12">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-orange-500"></i>
                <p class="text-xs text-dark-muted mt-2">データを読み込んでいます...</p>
            </div>

            <div id="shop-list" class="grid grid-cols-2 gap-3 sm:gap-4"></div>

            <div id="no-data" class="hidden text-center py-12 bg-dark-card rounded-xl border border-dark-border">
                <i class="fa-solid fa-face-grimace text-3xl text-dark-muted mb-2"></i>
                <p class="text-sm text-dark-muted">条件に一致するお店が見つかりませんでした。</p>
            </div>
        </div>

    </main>

    <!-- フッターバー -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-dark-card/95 backdrop-blur-md border-t border-dark-border px-4 py-3 shadow-2xl">
        <div class="max-w-4xl mx-auto flex items-center justify-around gap-2">
            <button onclick="openSearchModal()" class="flex-1 bg-dark-input hover:bg-dark-border border border-dark-border text-dark-text font-medium py-3 px-2 rounded-xl text-xs transition flex flex-col sm:flex-row items-center justify-center gap-1">
                <i class="fa-solid fa-search text-orange-400 text-base"></i>
                <span>検索</span>
            </button>
            <button onclick="openBadgeModal()" class="flex-1 bg-dark-input hover:bg-dark-border border border-amber-500/40 text-amber-400 font-medium py-3 px-2 rounded-xl text-xs transition flex flex-col sm:flex-row items-center justify-center gap-1">
                <i class="fa-solid fa-medal text-amber-400 text-base"></i>
                <span>バッチ図鑑</span>
            </button>
            <button onclick="openRouletteModal()" class="w-14 bg-dark-input hover:bg-dark-border border border-orange-500/40 text-orange-400 font-medium py-3 px-2 rounded-xl transition flex items-center justify-center" title="ガチャ">
                <i class="fa-solid fa-dice text-xl animate-bounce"></i>
            </button>
            <button onclick="openAddModal()" class="flex-1 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3 px-2 rounded-xl text-xs transition shadow-lg flex flex-col sm:flex-row items-center justify-center gap-1">
                <i class="fa-solid fa-plus-circle text-base"></i>
                <span>追加</span>
            </button>
        </div>
    </nav>

    <!-- バッチ図鑑モーダル -->
    <div id="badge-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card w-full max-w-2xl rounded-2xl border border-dark-border shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-dark-border flex justify-between items-center bg-dark-input">
                <div class="flex items-center space-x-2">
                    <i class="
