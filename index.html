<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？ - 日本全国ご当地名物開拓手帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#121212', card: '#1e1e1e', input: '#2d2d2d', border: '#3f3f46', text: '#f3f4f6', muted: '#9ca3af' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 15px rgba(249, 115, 22, 0.6); transform: scale(1); }
            50% { text-shadow: 0 0 30px rgba(249, 115, 22, 0.9); transform: scale(1.03); }
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(249, 115, 22, 0.7); }
        }
        @keyframes popPin {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(-45deg); opacity: 1; }
            100% { transform: scale(1) rotate(-45deg); opacity: 1; }
        }
        @keyframes badgePop {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .anim-title { animation: pulseGlow 2s ease-in-out infinite; }
        .anim-icon { animation: floatIcon 1.5s ease-in-out infinite; }
        .anim-start-btn { animation: pulseBtn 2s ease-in-out infinite; }
        .dropped-pin { animation: popPin 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .badge-anim { animation: badgePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        body { background-color: #121212; color: #f3f4f6; }

        #map {
            width: 100%;
            height: 380px;
            border-radius: 1rem;
            z-index: 1;
            background-color: #1e1e1e;
        }

        .cloud-fog-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background: radial-gradient(circle at 50% 40%, rgba(220, 230, 242, 0.4) 0%, rgba(140, 155, 175, 0.75) 100%);
            backdrop-filter: blur(1.5px);
        }

        #cloud-svg-overlay {
            position: absolute;
            inset: 0;
            z-index: 11;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        .leaflet-container .leaflet-overlay-pane svg { pointer-events: none; }
        .leaflet-interactive { pointer-events: auto; }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- オープニング画面 -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-dark-bg flex flex-col items-center justify-center p-6 text-center transition-opacity duration-700">
        <div class="space-y-6 max-w-sm w-full flex flex-col items-center">
            <div class="inline-block text-orange-500 text-5xl anim-icon mb-2">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <div class="space-y-2">
                <h1 class="text-3xl font-black tracking-widest text-white anim-title">なにクウ？</h1>
                <p class="text-xs text-orange-400 font-bold tracking-wider uppercase border-t border-b border-orange-500/30 py-1 inline-block px-4">- 日本全国 ご当地名物開拓手帳 -</p>
            </div>
            <p class="text-xs text-dark-muted">お店を登録し、全国1,741市区町村の名物バッチを集めよう！</p>
            <div class="pt-6">
                <button onclick="closeSplashScreen()" class="anim-start-btn group bg-gradient-to-b from-orange-500 to-amber-600 hover:from-orange-400 hover:to-amber-500 text-white w-28 h-28 rounded-full shadow-2xl flex flex-col items-center justify-center border-4 border-amber-300/60 transition transform active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-bowl-food text-3xl mb-1 text-amber-100"></i>
                    <span class="text-xs font-black tracking-widest uppercase text-amber-100">START</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="bg-dark-card border-b border-dark-border sticky top-0 z-40 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-utensils text-orange-500 text-xl"></i>
                <h1 class="text-lg font-bold tracking-wider">なにクウ？ <span class="text-xs bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-full border border-orange-500/30">Japan Edition</span></h1>
            </div>
            <div class="flex items-center space-x-2 bg-dark-input px-3 py-1.5 rounded-full border border-dark-border text-sm">
                <i class="fa-solid fa-user text-orange-400"></i>
                <span id="display-username" class="font-medium max-w-[100px] truncate">グルメハンター</span>
                <button onclick="changeUsername()" class="text-dark-muted hover:text-white transition"><i class="fa-solid fa-pen text-xs"></i></button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- マップ & 雲エリア -->
        <section class="bg-dark-card border border-dark-border rounded-2xl p-4 sm:p-6 shadow-xl relative overflow-hidden">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-earth-asia text-orange-400 text-lg"></i>
                        <h2 class="font-bold text-base text-white">日本列島 開拓ビュー</h2>
                    </div>
                    <span id="exploration-rate" class="text-xs bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2.5 py-1 rounded-full font-bold">登録スポット: 0件</span>
                </div>
                <p class="text-xs text-dark-muted">お店を登録して、全国の霧を晴らしていこう！</p>
                
                <div class="relative rounded-2xl overflow-hidden border border-dark-border shadow-inner">
                    <div id="map"></div>
                    <div id="cloud-fog" class="cloud-fog-layer"></div>
                    <svg id="cloud-svg-overlay">
                        <defs>
                            <mask id="cloud-mask">
                                <rect width="100%" height="100%" fill="white" />
                                <g id="cloud-holes"></g>
                            </mask>
                        </defs>
                        <rect width="100%" height="100%" fill="rgba(160, 175, 195, 0.85)" mask="url(#cloud-mask)" />
                    </svg>
                </div>
            </div>
        </section>

        <!-- 飲食店リストセクション -->
        <div class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-dark-muted uppercase tracking-wider">登録されたお店 (<span id="shop-count">0</span>件)</h2>
                <button onclick="openAddModal()" class="text-xs bg-orange-500 hover:bg-orange-600 text-white font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1 shadow-md">
                    <i class="fa-solid fa-plus"></i><span>お店を追加</span>
                </button>
            </div>
            
            <div id="loading-spinner" class="text-center py-8">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-orange-500"></i>
                <p class="text-xs text-dark-muted mt-2">データを読み込んでいます...</p>
            </div>

            <div id="shop-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>

            <div id="no-data" class="hidden text-center py-12 bg-dark-card rounded-xl border border-dark-border">
                <i class="fa-solid fa-bowl-food text-3xl text-dark-muted mb-2"></i>
                <p class="text-sm text-dark-muted">まだお店が登録されていません。「お店を追加」してみましょう！</p>
            </div>
        </div>

    </main>

    <!-- フッターナビゲーション -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-dark-card/95 backdrop-blur-md border-t border-dark-border px-4 py-3 shadow-2xl">
        <div class="max-w-4xl mx-auto flex items-center justify-around gap-2">
            <button onclick="openSearchModal()" class="flex-1 bg-dark-input hover:bg-dark-border border border-dark-border text-dark-text font-medium py-3 px-2 rounded-xl text-xs transition flex flex-col items-center justify-center gap-1">
                <i class="fa-solid fa-search text-orange-400 text-base"></i>
                <span>検索</span>
            </button>
            <button onclick="openBadgeModal()" class="flex-1 bg-dark-input hover:bg-dark-border border border-amber-500/40 text-amber-400 font-medium py-3 px-2 rounded-xl text-xs transition flex flex-col items-center justify-center gap-1">
                <i class="fa-solid fa-award text-amber-400 text-base"></i>
                <span>名物バッチ図鑑</span>
            </button>
            <button onclick="openAddModal()" class="flex-1 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3 px-2 rounded-xl text-xs transition shadow-lg flex flex-col items-center justify-center gap-1">
                <i class="fa-solid fa-plus-circle text-base"></i>
                <span>お店登録</span>
            </button>
        </div>
    </nav>

    <!-- お店追加モーダル -->
    <div id="add-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-card border border-dark-border w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-dark-border pb-3">
                <h3 class="font-bold text-white text-base flex items-center"><i class="fa-solid fa-utensils text-orange-400 mr-2"></i>新しいお店を登録</h3>
                <button onclick="closeAddModal()" class="text-dark-muted hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="add-shop-form" onsubmit="saveShop(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-dark-muted mb-1">店名</label>
                    <input type="text" id="shop-name" required class="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500" placeholder="例: ○○食堂">
                </div>
                <div>
                    <label class="block text-xs text-dark-muted mb-1">市区町村名 (例: 愛知県半田市、東京都渋谷区)</label>
                    <input type="text" id="shop-city" required class="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500" placeholder="例: 半田市">
                </div>
                <div>
                    <label class="block text-xs text-dark-muted mb-1">食べた名物・グルメ名</label>
                    <input type="text" id="shop-gourmet" required class="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500" placeholder="例: 味噌カツ、ラーメン、寿司">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-dark-muted mb-1">緯度 (Latitude)</label>
                        <input type="number" step="any" id="shop-lat" required class="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500" placeholder="34.89">
                    </div>
                    <div>
                        <label class="block text-xs text-dark-muted mb-1">経度 (Longitude)</label>
                        <input type="number" step="any" id="shop-lng" required class="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500" placeholder="136.93">
                    </div>
                </div>
                <div class="pt-2 flex space-x-2">
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-dark-input text-dark-muted py-2.5 rounded-xl text-xs font-bold hover:bg-dark-border transition">キャンセル</button>
                    <button type="submit" class="flex-1 bg-gradient-to-r from-orange-500 to-amber-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-lg hover:from-orange-600 hover:to-amber-600 transition">登録してバッチ獲得！</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ご当地名物バッチ図鑑モーダル -->
    <div id="badge-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-dark-card border border-dark-border w-full max-w-lg rounded-2xl p-5 space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-dark-border pb-3">
                <div>
                    <h3 class="font-black text-amber-400 text-base flex items-center"><i class="fa-solid fa-award mr-2"></i>全国ご当地名物バッチ図鑑</h3>
                    <p id="badge-total-count" class="text-xs text-dark-muted mt-0.5">全1,741市区町村中 0個獲得</p>
                </div>
                <button onclick="closeBadgeModal()" class="text-dark-muted hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="bg-dark-input p-3 rounded-xl border border-dark-border flex items-center justify-between">
                <div>
                    <p class="text-xs text-dark-muted">現在の開拓者ステータス</p>
                    <p id="collector-status" class="text-sm font-black text-white">見習いハンター</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-dark-muted">コンプリート率</p>
                    <p id="collector-rate" class="text-sm font-black text-orange-400">0.0%</p>
                </div>
            </div>

            <!-- バッチ一覧グリッド -->
            <div id="badge-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto pr-1 flex-1">
                <!-- 動的に生成されます -->
            </div>

            <button onclick="closeBadgeModal()" class="w-full bg-dark-input text-white py-2.5 rounded-xl text-xs font-bold border border-dark-border hover:bg-dark-border transition">閉じる</button>
        </div>
    </div>

    <!-- 検索モーダル -->
    <div id="search-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-card border border-dark-border w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-dark-border pb-3">
                <h3 class="font-bold text-white text-base"><i class="fa-solid fa-search text-orange-400 mr-2"></i>お店を検索</h3>
                <button onclick="closeSearchModal()" class="text-dark-muted hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="text" id="search-keyword" oninput="filterShops()" class="w-full bg-dark-input border border-dark-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500" placeholder="店名や市区町村名で絞り込み...">
            <div id="search-results" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
        </div>
    </div>

    <!-- JavaScriptロジック -->
    <script>
        const TOTAL_MUNICIPALITIES = 1741; // 日本の全市町村数
        let username = localStorage.getItem('naniku_username') || 'グルメハンター';
        let shops = JSON.parse(localStorage.getItem('naniku_shops') || '[]');
        let map, svgHoles;

        // アイコンや名物データベース（市区町村名またはキーワードにマッチ）
        const gourmetDatabase = {
            '半田': { icon: 'fa-fish', name: '南知多の海の幸・お酒', title: '知多半島の美食家' },
            '名古屋': { icon: 'fa-drumstick-bite', name: '味噌カツ・手羽先', title: '名古屋コーチン王' },
            '札幌': { icon: 'fa-bowl-food', name: '札幌味噌ラーメン', title: '北の大地の開拓者' },
            '渋谷': { icon: 'fa-burger', name: '渋谷ストリートフード', title: 'トレンドセッター' },
            '新宿': { icon: 'fa-mug-hot', name: '新宿カフェ・名店', title: '眠らない街の美食家' },
            '大阪': { icon: 'fa-pizza-slice', name: 'たこ焼き・お好み焼き', title: '天下の台所長' },
            '福岡': { icon: 'fa-bowl-rice', name: '博多とんこつラーメン', title: '屋台の達人' }
        };

        function getGourmetInfo(cityName, gourmetName) {
            for (let key in gourmetDatabase) {
                if (cityName.includes(key) || gourmetName.includes(key)) {
                    return gourmetDatabase[key];
                }
            }
            // デフォルトの名物イラスト
            return { icon: 'fa-utensils', name: gourmetName || 'ご当地グルメ', title: 'ご当地ハンター' };
        }

        document.getElementById('display-username').innerText = username;

        function closeSplashScreen() {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 700);
        }

        function changeUsername() {
            const newName = prompt('新しいハンター名を入力してください:', username);
            if (newName && newName.trim() !== '') {
                username = newName.trim();
                localStorage.setItem('naniku_username', username);
                document.getElementById('display-username').innerText = username;
            }
        }

        // マップ初期化
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([35.6812, 139.7671], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            svgHoles = document.getElementById('cloud-holes');
            updateMapAndFog();
        }

        function updateMapAndFog() {
            svgHoles.innerHTML = '';
            let latlngs = [];

            shops.forEach(shop => {
                const latLng = [shop.lat, shop.lng];
                latlngs.push(latLng);

                // マップ上にピンを配置
                L.marker(latLng).addTo(map);

                // 雲に穴をあけるSVG座標計算（簡易投影）
                const point = map.latLngToContainerPoint(latLng);
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', point.x);
                circle.setAttribute('cy', point.y);
                circle.setAttribute('r', '75'); // 晴れる半径
                circle.setAttribute('fill', 'black');
                svgHoles.appendChild(circle);
            });

            if (latlngs.length > 0) {
                map.fitBounds(latlngs, { maxZoom: 14, padding: [30, 30] });
            }

            document.getElementById('exploration-rate').innerText = `登録スポット: ${shops.length}件`;
            document.getElementById('shop-count').innerText = shops.length;
            renderShopList();
        }

        // モーダル制御
        function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }
        function openBadgeModal() { renderBadgeGrid(); document.getElementById('badge-modal').classList.remove('hidden'); }
        function closeBadgeModal() { document.getElementById('badge-modal').classList.add('hidden'); }
        function openSearchModal() { filterShops(); document.getElementById('search-modal').classList.remove('hidden'); }
        function closeSearchModal() { document.getElementById('search-modal').classList.add('hidden'); }

        // お店の保存
        function saveShop(event) {
            event.preventDefault();
            const name = document.getElementById('shop-name').value;
            const city = document.getElementById('shop-city').value;
            const gourmet = document.getElementById('shop-gourmet').value;
            const lat = parseFloat(document.getElementById('shop-lat').value);
            const lng = parseFloat(document.getElementById('shop-lng').value);

            shops.push({ id: Date.now(), name, city, gourmet, lat, lng });
            localStorage.setItem('naniku_shops', JSON.stringify(shops));

            closeAddModal();
            document.getElementById('add-shop-form').reset();
            updateMapAndFog();
            alert(`「${city}」の名物バッチを獲得しました！`);
        }

        // お店リストのレンダリング
        function renderShopList() {
            const listEl = document.getElementById('shop-list');
            const noDataEl = document.getElementById('no-data');
            const spinner = document.getElementById('loading-spinner');
            spinner.style.display = 'none';

            listEl.innerHTML = '';
            if (shops.length === 0) {
                noDataEl.classList.remove('hidden');
                return;
            }
            noDataEl.classList.add('hidden');

            shops.forEach(shop => {
                const info = getGourmetInfo(shop.city, shop.gourmet);
                const card = document.createElement('div');
                card.className = 'bg-dark-input border border-dark-border p-3 rounded-xl flex items-center space-x-3 shadow-md';
                card.innerHTML = `
                    <div class="w-12 h-12 rounded-xl bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-400 text-xl shrink-0">
                        <i class="fa-solid ${info.icon}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center space-x-1">
                            <span class="text-[10px] bg-orange-500/20 text-orange-300 px-1.5 py-0.5 rounded">${shop.city}</span>
                            <h4 class="text-sm font-bold text-white truncate">${shop.name}</h4>
                        </div>
                        <p class="text-xs text-dark-muted truncate mt-0.5">名物: ${info.name}</p>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // ご当地バッチ図鑑の表示
        function renderBadgeGrid() {
            const grid = document.getElementById('badge-grid');
            grid.innerHTML = '';

            // 収集済みの市区町村リストを作成
            const collectedCities = [...new Set(shops.map(s => s.city))];
            const earnedCount = collectedCities.length;

            document.getElementById('badge-total-count').innerText = `全 ${TOTAL_MUNICIPALITIES} 市区町村中 ${earnedCount} 個獲得`;
            const rate = ((earnedCount / TOTAL_MUNICIPALITIES) * 100).toFixed(1);
            document.getElementById('collector-rate').innerText = `${rate}%`;

            if (earnedCount > 10) {
                document.getElementById('collector-status').innerText = '日本一周グルメ王';
            } else if (earnedCount > 3) {
                document.getElementById('collector-status').innerText = '都道府県ハンター';
            } else {
                document.getElementById('collector-status').innerText = '見習いハンター';
            }

            // 登録されたお店からバッチを生成
            if (shops.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-xs text-dark-muted">まだ獲得した名物バッチはありません。お店を追加して図鑑を埋めよう！</div>`;
                return;
            }

            shops.forEach(shop => {
                const info = getGourmetInfo(shop.city, shop.gourmet);
                const badgeItem = document.createElement('div');
                badgeItem.className = 'bg-dark-bg border border-amber-500/30 rounded-xl p-3 flex flex-col items-center text-center space-y-2 relative shadow-lg badge-anim';
                badgeItem.innerHTML = `
                    <div class="absolute top-2 right-2 text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded font-bold">徽章</div>
                    <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-orange-500 to-amber-400 p-0.5 shadow-md flex items-center justify-center mt-1">
                        <div class="w-full h-full bg-dark-card rounded-full flex items-center justify-center text-amber-400 text-2xl">
                            <i class="fa-solid ${info.icon}"></i>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-xs font-black text-white truncate max-w-[120px]">${shop.city}</h4>
                        <p class="text-[10px] text-amber-400 font-semibold truncate max-w-[120px]">${info.name}</p>
                    </div>
                `;
                grid.appendChild(badgeItem);
            });
        }

        function filterShops() {
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            const resultsEl = document.getElementById('search-results');
            resultsEl.innerHTML = '';

            const filtered = shops.filter(s => s.name.toLowerCase().includes(keyword) || s.city.toLowerCase().includes(keyword) || s.gourmet.toLowerCase().includes(keyword));

            if (filtered.length === 0) {
                resultsEl.innerHTML = `<p class="text-xs text-dark-muted text-center py-4">該当するお店が見つかりませんでした。</p>`;
                return;
            }

            filtered.forEach(shop => {
                const div = document.createElement('div');
                div.className = 'bg-dark-input p-2.5 rounded-xl border border-dark-border flex justify-between items-center text-xs';
                div.innerHTML = `
                    <div>
                        <span class="text-orange-400 font-bold">[${shop.city}]</span>
                        <span class="text-white font-medium ml-1">${shop.name}</span>
                    </div>
                    <span class="text-dark-muted">${shop.gourmet}</span>
                `;
                resultsEl.appendChild(div);
            });
        }

        window.onload = initMap;
    </script>
</body>
</html>
