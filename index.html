<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？ - 自分だけのグルメ手帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#121212', card: '#1e1e1e', input: '#2d2d2d', border: '#3f3f46', text: '#f3f4f6', muted: '#9ca3af' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- GeoJSONプラグイン -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 15px rgba(249, 115, 22, 0.6); transform: scale(1); }
            50% { text-shadow: 0 0 30px rgba(249, 115, 22, 0.9); transform: scale(1.03); }
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(249, 115, 22, 0.7); }
        }
        /* ピンがズームイン後に登場する演出 */
        @keyframes popPin {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(-45deg); opacity: 1; }
            100% { transform: scale(1) rotate(-45deg); opacity: 1; }
        }
        @keyframes shockwave {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .anim-title { animation: pulseGlow 2s ease-in-out infinite; }
        .anim-icon { animation: floatIcon 1.5s ease-in-out infinite; }
        .anim-start-btn { animation: pulseBtn 2s ease-in-out infinite; }
        
        .dropped-pin {
            animation: popPin 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .pin-shockwave {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(249, 115, 22, 0.7);
            transform: translate(-50%, -50%) scale(0.2);
            animation: shockwave 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 5;
        }
        
        body { background-color: #121212; color: #f3f4f6; }

        #map {
            width: 100%;
            height: 420px;
            border-radius: 1rem;
            z-index: 1;
            background-color: #1e1e1e;
        }

        .cloud-fog-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background: radial-gradient(circle at 50% 40%, rgba(220, 230, 242, 0.4) 0%, rgba(140, 155, 175, 0.75) 100%);
            backdrop-filter: blur(1.5px);
        }

        #cloud-svg-overlay {
            position: absolute;
            inset: 0;
            z-index: 11;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        .leaflet-container .leaflet-overlay-pane svg { pointer-events: none; }
        .leaflet-interactive { pointer-events: auto; }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- オープニング画面 -->

        <div class="space-y-6 max-w-sm w-full flex flex-col items-center">
            <div class="inline-block text-orange-500 text-5xl anim-icon mb-2">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <div class="space-y-2">
                <h1 class="text-3xl font-black tracking-widest text-white anim-title">なにクウ？</h1>

            </div>
            <p class="text-xs text-dark-muted">お店を登録して雲を晴らそう！</p>
            <div class="pt-6">

                    <span class="text-xs font-black tracking-widest uppercase text-amber-100">START</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="bg-dark-card border-b border-dark-border sticky top-0 z-40 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-utensils text-orange-500 text-xl"></i>
                <h1 class="text-lg font-bold tracking-wider">なにクウ？ <span class="text-xs bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-full border border-orange-500/30">Detail Map</span></h1>
            </div>
            <div class="flex items-center space-x-2 bg-dark-input px-3 py-1.5 rounded-full border border-dark-border text-sm">

            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <section class="bg-dark-card border border-dark-border rounded-2xl p-4 sm:p-6 shadow-xl relative overflow-hidden">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-earth-asia text-orange-400 text-lg"></i>

                    </div>
                    <span id="exploration-rate" class="text-xs bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2.5 py-1 rounded-full font-bold">開拓スポット: 0件</span>

                <p class="text-xs text-dark-muted">お店を登録すると、周辺半径1kmの雲が綺麗に晴れていきます！</p>
                
                <div class="relative rounded-2xl overflow-hidden border border-dark-border shadow-inner">
                    <div id="map"></div>
                    <div id="cloud-fog" class="cloud-fog-layer"></div>
                    <svg id="cloud-svg-overlay">
                        <defs>
                            <mask id="cloud-mask">
                                <rect width="100%" height="100%" fill="white" />

                            </mask>
                        </defs>
                        <rect width="100%" height="100%" fill="rgba(160, 175, 195, 0.85)" mask="url(#cloud-mask)" />
                    </svg>
                    
                    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none w-11/12 max-w-xs">
                        <div class="bg-black/80 backdrop-blur-md px-4 py-2 rounded-xl border border-white/10 shadow-2xl text-center">

        <!-- 飲食店リスト -->

            <div id="loading-spinner" class="text-center py-12">

            <!-- 修正: 常に横2列・縦無制限 (grid-cols-2) に設定 -->

        </div>

    </main>

    <!-- フッターバー -->

        <div class="max-w-4xl mx-auto flex items-center justify-around gap-2">
            <button onclick="openSearchModal()" class="flex-1 bg-dark-input hover:bg-dark-border border border-dark-border text-dark-text font-medium py-3 px-2 rounded-xl text-xs transition flex flex-col sm:flex-row items-center justify-center gap-1">

            <button onclick="openRouletteModal()" class="w-16 bg-dark-input hover:bg-dark-border border border-orange-500/40 text-orange-400 font-medium py-3 px-2 rounded-xl transition flex items-center justify-center" title="ガチャ">

            </button>
            <button onclick="openAddModal()" class="flex-1 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3 px-2 rounded-xl text-xs transition shadow-lg flex flex-col sm:flex-row items-center justify-center gap-1">

                <span>お店を追加</span>
            </button>
        </div>
    </nav>

    <!-- 検索モーダル -->
    <div id="search-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-dark-card w-full max-w-lg rounded-t-2xl sm:rounded-2xl border border-dark-border shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-dark-border flex justify-between items-center bg-dark-input">
                <h3 class="font-bold text-base"><i class="fa-solid fa-search text-orange-400 mr-2"></i>お店を検索</h3>
                <button onclick="closeSearchModal()" class="text-dark-muted hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 space-y-4 overflow-y-auto">

                <div>

                        <option value="">すべてのジャンル</option>
                        <option value="和食">和食</option><option value="洋食">洋食</option><option value="中華">中華</option><option value="ラーメン">ラーメン</option><option value="焼肉・肉料理">焼肉・肉料理</option><option value="居酒屋・バー">居酒屋・バー</option><option value="カフェ・スイーツ">カフェ・スイーツ</option><option value="エスニック・カレー">エスニック・カレー</option><option value="その他">その他</option>
                    </select>

            <div class="p-4 border-t border-dark-border bg-dark-input flex justify-end">

            </div>
        </div>
    </div>

    <!-- お店追加モーダル -->
    <div id="shop-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card w-full max-w-lg rounded-2xl border border-dark-border shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-dark-border flex justify-between items-center bg-dark-input">
                <h3 id="modal-title" class="font-bold text-base">お店を追加する</h3>
                <button onclick="closeModal()" class="text-dark-muted hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="edit-shop-id">
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">店名 <span class="text-orange-500">*</span></label>
                    <input type="text" id="shop-name" placeholder="例: レストラン〇〇" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-dark-muted mb-1">ジャンル <span class="text-orange-500">*</span></label>
                        <select id="shop-genre" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                            <option value="和食">和食</option><option value="洋食">洋食</option><option value="中華">中華</option><option value="ラーメン">ラーメン</option><option value="焼肉・肉料理">焼肉・肉料理</option><option value="居酒屋・バー">居酒屋・バー</option><option value="カフェ・スイーツ">カフェ・スイーツ</option><option value="エスニック・カレー">エスニック・カレー</option><option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-dark-muted mb-1">都道府県 <span class="text-orange-500">*</span></label>
                        <select id="shop-pref" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                            <option value="北海道">北海道</option><option value="青森県">青森県</option><option value="岩手県">岩手県</option><option value="宮城県">宮城県</option><option value="秋田県">秋田県</option><option value="山形県">山形県</option><option value="福島県">福島県</option>
                            <option value="茨城県">茨城県</option><option value="栃木県">栃木県</option><option value="群馬県">群馬県</option><option value="埼玉県">埼玉県</option><option value="千葉県">千葉県</option><option value="東京都" selected>東京都</option><option value="神奈川県">神奈川県</option>
                            <option value="新潟県">新潟県</option><option value="富山県">富山県</option><option value="石川県">石川県</option><option value="福井県">福井県</option><option value="山梨県">山梨県</option><option value="長野県">長野県</option>
                            <option value="岐阜県">岐阜県</option><option value="静岡県">静岡県</option><option value="愛知県">愛知県</option><option value="三重県">三重県</option>
                            <option value="滋賀県">滋賀県</option><option value="京都府">京都府</option><option value="大阪府">大阪府</option><option value="兵庫県">兵庫県</option><option value="奈良県">奈良県</option><option value="和歌山県">和歌山県</option>
                            <option value="鳥取県">鳥取県</option><option value="島根県">島根県</option><option value="岡山県">岡山県</option><option value="広島県">広島県</option><option value="山口県">山口県</option>
                            <option value="徳島県">徳島県</option><option value="香川県">香川県</option><option value="愛媛県">愛媛県</option><option value="高知県">高知県</option>
                            <option value="福岡県">福岡県</option><option value="佐賀県">佐賀県</option><option value="長崎県">長崎県</option><option value="熊本県">熊本県</option><option value="大分県">大分県</option><option value="宮崎県">宮崎県</option><option value="鹿児島県">鹿児島県</option><option value="沖縄県">沖縄県</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-dark-muted mb-1">市区町村名 <span class="text-orange-500">*</span></label>
                        <input type="text" id="shop-city" placeholder="例: 渋谷区" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-dark-muted mb-1">区・番地 <span class="text-orange-500">*</span></label>
                        <input type="text" id="shop-address" placeholder="例: 道玄坂1-2-3" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">マンション名・ビル名など</label>
                    <input type="text" id="shop-building" placeholder="例: 〇〇ビル 2F" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">おすすめメニュー・コメント</label>
                    <textarea id="shop-comment" rows="2" placeholder="感想など" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">参考URL</label>
                    <input type="url" id="shop-url" placeholder="https://..." class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">お店の写真</label>
                    <input type="file" id="shop-image" accept="image/*" class="w-full text-xs text-dark-muted file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-orange-500/20 file:text-orange-400 cursor-pointer">
                    <div id="image-upload-progress" class="hidden mt-2 text-xs text-orange-400">位置情報を高精度で取得して保存中...</div>
                </div>
            </div>
            <div class="p-4 border-t border-dark-border bg-dark-input flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm bg-dark-border hover:bg-dark-muted/30 transition">キャンセル</button>
                <button onclick="saveShop()" id="save-btn" class="px-5 py-2 rounded-lg text-sm bg-orange-500 hover:bg-orange-600 text-white font-bold transition">保存する</button>
            </div>
        </div>
    </div>

    <!-- ルーレットモーダル -->
    <div id="roulette-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card w-full max-w-md rounded-2xl border border-dark-border shadow-2xl p-6 text-center space-y-6">
            <h3 class="font-bold text-lg text-orange-400"><i class="fa-solid fa-dice mr-2"></i>今日のランチガチャ</h3>
            <div id="roulette-box" class="bg-dark-input border-2 border-orange-500/50 rounded-xl p-8 min-h-[140px] flex flex-col items-center justify-center space-y-2">
                <span id="roulette-text" class="text-xl font-bold text-gray-200">お店を選んでいます...</span>
                <span id="roulette-sub" class="text-xs text-dark-muted"></span>
            </div>
            <div class="flex space-x-3">
                <button onclick="closeRouletteModal()" class="flex-1 bg-dark-border hover:bg-dark-muted/30 py-2.5 rounded-lg text-sm transition">とじる</button>
                <button onclick="startRoulette()" id="roulette-btn" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-lg text-sm transition">もう一度回す</button>
            </div>
        </div>
    </div>

    <!-- スクリプト -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "nanikuu-v2.firebaseapp.com",
            databaseURL: "https://nanikuu-v2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nanikuu-v2",
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        function getDatabaseRef() { return firebase.database(); }

        var currentUserName = '';
        var allShops = [];
        var map;
        var prefLayer;
        var markersLayer = L.layerGroup();
        var justAddedShopId = null; 

        const prefCoordinates = {

        function initMap() {
            try {
                map = L.map('map', { 
                    zoomControl: true,
                    minZoom: 5,
                    maxZoom: 19
                }).setView([36.2048, 138.2529], 5);
                
                // 【変更】国土地理院の「標準地図」レイヤーに変更（リアルな色分けや地形・標高が分かりやすい地図）
                L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>国土地理院（標準地図）</a>"
                }).addTo(map);

                if (typeof L.GeoJSON.AJAX !== 'undefined') {
                    prefLayer = new L.GeoJSON.AJAX('https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson', {
                        style: {
                            color: '#ffffff',
                            weight: 1.5,
                            opacity: 0.9,
                            fillOpacity: 0
                        }
                    });
                    prefLayer.addTo(map);
                }
                markersLayer.addTo(map);

        function initUser() {
            const savedName = localStorage.getItem('nanikuu_web_username');
            if (savedName) currentUserName = savedName;
            else promptForUsername(true);
            updateUsernameDisplay();
        }

        function promptForUsername(isFirst = false) {
            const name = prompt(isFirst ? 'ニックネームを入力してください：' : '名前を変更：', currentUserName || '');
            if (name && name.trim() !== '') {
                currentUserName = name.trim();
                localStorage.setItem('nanikuu_web_username', currentUserName);
            } else if (isFirst) {
                currentUserName = 'ゲスト_' + Math.floor(Math.random() * 9000 + 1000);
                localStorage.setItem('nanikuu_web_username', currentUserName);
            }
            updateUsernameDisplay();
        }
        function changeUsername() { promptForUsername(false); }
        function updateUsernameDisplay() {
            const el = document.getElementById('display-username');
            if (el) el.textContent = currentUserName;
        }

        function loadShops() {
            getDatabaseRef().ref('shops').on('value', (snapshot) => {
                const data = snapshot.val();
                allShops = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        allShops.push({ id: key, ...data[key] });
                    });
                }
                allShops.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                const spinner = document.getElementById('loading-spinner');
                if (spinner) spinner.classList.add('hidden');
                filterShops();
                renderMarkers();
                updateCloudHoles();

                if (justAddedShopId) {
                    const targetShop = allShops.find(s => s.id === justAddedShopId);
                    if (targetShop && targetShop.lat && targetShop.lng && map) {
                        map.setView([36.2048, 138.2529], 5, { animate: false });
                        
                        setTimeout(() => {
                            map.flyTo([targetShop.lat, targetShop.lng], 16, {
                                duration: 2.2,
                                easeLinearity: 0.25
                            });
                        }, 300);
                    }
                    justAddedShopId = null;
                }
            });
        }

        function renderMarkers() {
            if (!markersLayer) return;
            markersLayer.clearLayers();
            allShops.forEach(shop => {
                if (shop.lat && shop.lng) {
                    const isNew = (shop.id === justAddedShopId);
                    const iconClass = isNew ? 'dropped-pin' : '';
                    
                    const pinHtml = `
                        <div style="position: relative; width: 36px; height: 36px;">
                            ${isNew ? '<div class="pin-shockwave"></div>' : ''}
                            <div class="${iconClass}" style="background-color: #f97316; width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(249,115,22,0.8); border: 2px solid #fff; position: absolute; top: 4px; left: 4px;">
                                <i class="fa-solid fa-utensils" style="transform: rotate(45deg); color: #fff; font-size: 12px;"></i>
                            </div>
                        </div>
                    `;

                    const pinIcon = L.divIcon({
                        className: 'custom-pin-animated',
                        html: pinHtml,
                        iconSize: [36, 36],
                        iconAnchor: [18, 36],
                        popupAnchor: [0, -36]
                    });

                    const fullAddr = `${shop.pref || ''}${shop.city || ''}${shop.address || ''} ${shop.building || ''}`;
                    const marker = L.marker([shop.lat, shop.lng], { icon: pinIcon });
                    marker.bindPopup(`<div style="color: #121212; font-weight: bold;">${escapeHtml(shop.name)}</div><div style="font-size: 11px; color: #555;">${escapeHtml(fullAddr)}</div>`);
                    markersLayer.addLayer(marker);
                }
            });
        }

        function updateCloudHoles() {
            const holesGroup = document.getElementById('cloud-holes');
            if (!holesGroup || !map) return;
            holesGroup.innerHTML = '';

            let validCount = 0;
            allShops.forEach(shop => {
                if (shop.lat && shop.lng) {
                    validCount++;
                    const centerPt = map.latLngToContainerPoint([shop.lat, shop.lng]);
                    const latOffset = 1000 / 111320;
                    const northPt = map.latLngToContainerPoint([shop.lat + latOffset, shop.lng]);
                    const radius = Math.sqrt(Math.pow(centerPt.x - northPt.x, 2) + Math.pow(centerPt.y - northPt.y, 2));

                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', centerPt.x);
                    circle.setAttribute('cy', centerPt.y);
                    circle.setAttribute('r', Math.max(10, radius));
                    circle.setAttribute('fill', 'black');
                    holesGroup.appendChild(circle);
                }
            });

            const rateEl = document.getElementById('exploration-rate');
            if (rateEl) rateEl.textContent = `開拓スポット: ${validCount}件`;
        }

        function filterShops() {
            const keywordEl = document.getElementById('search-keyword');
            const genreEl = document.getElementById('filter-genre');
            const keyword = keywordEl ? keywordEl.value.toLowerCase() : '';
            const genre = genreEl ? genreEl.value : '';

            const filtered = allShops.filter(shop => {
                const matchKeyword = !keyword || 
                    (shop.name && shop.name.toLowerCase().includes(keyword)) ||
                    (shop.pref && shop.pref.toLowerCase().includes(keyword)) ||
                    (shop.city && shop.city.toLowerCase().includes(keyword)) ||
                    (shop.address && shop.address.toLowerCase().includes(keyword)) ||
                    (shop.building && shop.building.toLowerCase().includes(keyword)) ||
                    (shop.comment && shop.comment.toLowerCase().includes(keyword));
                const matchGenre = !genre || shop.genre === genre;
                return matchKeyword && matchGenre;
            });

            renderShops(filtered);
        }

        function renderShops(shops) {

                card.innerHTML = `
                    <div>

                            <div class="flex justify-between items-start gap-1">
                                <div class="flex flex-wrap gap-1 items-center">
                                    <span class="text-[10px] bg-orange-500/20 text-orange-400 font-bold px-2 py-0.5 rounded border border-orange-500/30">${shop.genre || 'その他'}</span>
                                    <span class="text-[10px] bg-dark-input text-dark-muted px-2 py-0.5 rounded border border-dark-border truncate max-w-[100px] sm:max-w-xs"><i class="fa-solid fa-map-pin text-orange-400 mr-1"></i>${escapeHtml(fullAddress)}</span>
                                </div>
                                <div class="flex space-x-1 shrink-0">
                                    <button onclick="openEditModal('${shop.id}')" class="text-dark-muted hover:text-white p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteShop('${shop.id}')" class="text-dark-muted hover:text-red-400 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <h3 class="font-bold text-sm sm:text-base text-gray-100 truncate">${escapeHtml(shop.name)}</h3>
                            ${shop.comment ? `<p class="text-xs text-dark-muted line-clamp-2">${escapeHtml(shop.comment)}</p>` : ''}
                        </div>
                    </div>
                    <div class="p-3 sm:p-4 pt-0 border-t border-dark-border/40 mt-3 flex justify-between items-center bg-dark-card/50 gap-1">
                        <span class="text-[10px] sm:text-[11px] text-dark-muted truncate">追加: ${shop.author || '不明'}</span>
                        <button onclick="toggleItayo('${shop.id}')" class="px-2.5 py-1.5 rounded-lg text-[10px] sm:text-xs font-bold transition flex items-center space-x-1 shrink-0 ${hasItayo ? 'bg-orange-500 text-white shadow-sm' : 'bg-dark-input hover:bg-dark-border text-dark-muted border border-dark-border'}">

        async function getLatLngFromAddress(pref, city, address) {
            const queries = [
                `${pref}${city}${address}`,
                `${pref}${city}`,
                pref
            ];

            for (const q of queries) {
                if (!q) continue;
                try {
                    const response = await fetch(`https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(q)}`);
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const coordinates = data[0].geometry.coordinates;
                        return { lat: coordinates[1], lng: coordinates[0] };
                    }
                } catch (e) {
                    console.error('GSI Geocoding error:', e);
                }
            }
            return null;
        }

        async function saveShop() {
            const id = document.getElementById('edit-shop-id').value;
            const name = document.getElementById('shop-name').value.trim();
            const genre = document.getElementById('shop-genre').value;
            const pref = document.getElementById('shop-pref').value;
            const city = document.getElementById('shop-city').value.trim();
            const address = document.getElementById('shop-address').value.trim();
            const building = document.getElementById('shop-building').value.trim();
            const comment = document.getElementById('shop-comment').value.trim();
            const url = document.getElementById('shop-url').value.trim();
            const imageFile = document.getElementById('shop-image').files[0];

            if (!name) { alert('店名を入力してください。'); return; }
            if (!city) { alert('市区町村名を入力してください。'); return; }
            if (!address) { alert('区・番地を入力してください。'); return; }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            document.getElementById('image-upload-progress').classList.remove('hidden');

            try {
                let latLng = await getLatLngFromAddress(pref, city, address);
                if (!latLng && prefCoordinates[pref]) {
                    latLng = { lat: prefCoordinates[pref][0], lng: prefCoordinates[pref][1] };
                }
                
                if (!latLng) {
                    throw new Error('位置情報を取得できませんでした。');
                }

                let imageUrl = '';
                if (id) {
                    const existing = allShops.find(s => s.id === id);
                    if (existing && existing.imageUrl) imageUrl = existing.imageUrl;
                }
                if (imageFile) {
                    const resizedBlob = await resizeImage(imageFile, 250, 250, 0.4);
                    imageUrl = await convertBlobToBase64(resizedBlob);
                }

                const shopData = { 
                    name, genre, pref, city, address, building, comment, url, imageUrl, 
                    lat: latLng.lat, 
                    lng: latLng.lng, 
                    author: currentUserName 
                };

                const shopsRef = getDatabaseRef().ref('shops');
                if (id) {
                    justAddedShopId = id;
                    await shopsRef.child(id).update(shopData);
                } else {
                    shopData.createdAt = firebase.database.ServerValue.TIMESTAMP;
                    const newRef = shopsRef.push();
                    justAddedShopId = newRef.key;
                    await newRef.set(shopData);
                }
                closeModal();
            } catch (e) {
                alert('保存に失敗しました: ' + (e.message || e));
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '保存する';
                document.getElementById('image-upload-progress').classList.add('hidden');
            }
        }

        function deleteShop(id) {
            if (confirm('このお店を削除しますか？')) getDatabaseRef().ref(`shops/${id}`).remove();
        }

        function toggleItayo(shopId) {
            const shopRef = getDatabaseRef().ref(`shops/${shopId}/itayo`);
            shopRef.once('value', (snapshot) => {
                const data = snapshot.val() || {};
                let userKey = null;
                Object.keys(data).forEach(k => { if (data[k] === currentUserName) userKey = k; });
                if (userKey) shopRef.child(userKey).remove();
                else shopRef.push(currentUserName);
            });
        }

            const textEl = document.getElementById('roulette-text');

            btnEl.disabled = true;

            const timer = setInterval(() => {
                const rand = allShops[Math.floor(Math.random() * allShops.length)];
                textEl.textContent = rand.name;
                subEl.textContent = `${rand.genre} / ${rand.pref} ${rand.city} ${rand.address || ''}`;
                count++;
                if (count >= 15) {
                    clearInterval(timer);

                }
            }, 80);
        }

        function resizeImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > maxWidth) { h *= maxWidth/w; w = maxWidth; } }
                        else { if (h > maxHeight) { w *= maxHeight/h; h = maxHeight; } }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        function convertBlobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onloadend = () => resolve(r.result);
                r.onerror = reject;
                r.readAsDataURL(blob);
            });
        }
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`"<>]/g, (m) => ({ '&': '&amp;', '"': '&quot;', '<': '&lt;', '>': '&gt;' }[m]));
        }
