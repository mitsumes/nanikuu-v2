<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？ - グルメ共有 & 探索ゲーム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1p:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1p', sans-serif; }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen pb-20">

    <!-- ヘッダー -->
    <header class="bg-amber-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider">🍴 なにクウ？</h1>
        <div id="user-display" class="text-sm bg-amber-700 px-3 py-1 rounded-full"></div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-md mx-auto p-4">
        <!-- ホーム画面 -->
        <div id="view-home" class="space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-amber-100 text-center">
                <h2 class="text-lg font-bold text-amber-900 mb-2">ようこそ、なにクウへ！</h2>
                <p class="text-sm text-slate-600 mb-4">みんなで美味しいお店をシェアして、マップを広げよう。</p>
                <button onclick="switchView('post')" class="w-full bg-amber-600 text-white font-bold py-3 rounded-xl shadow hover:bg-amber-700 transition">お店を投稿する</button>
            </div>
            <!-- 投稿一覧エリア -->
            <div class="space-y-3" id="post-list">
                <p class="text-center text-slate-400 py-6">読み込み中...</p>
            </div>
        </div>

        <!-- 投稿画面 -->
        <div id="view-post" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-amber-100">
                <h2 class="text-lg font-bold text-amber-900 mb-4">お店を新しく登録</h2>
                <form id="entry-form" onsubmit="handlePost(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">店名</label>
                        <input type="text" id="shop-name" required class="w-full border rounded-lg p-2 text-sm" placeholder="例: カフェ・ド・なにクウ">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">エリア・場所</label>
                        <input type="text" id="shop-area" required class="w-full border rounded-lg p-2 text-sm" placeholder="例: 栄三丁目">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">ひとこと感想</label>
                        <textarea id="shop-comment" rows="3" class="w-full border rounded-lg p-2 text-sm" placeholder="美味しかったメニューなど"></textarea>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="button" onclick="switchView('home')" class="w-1/2 bg-slate-200 text-slate-700 font-bold py-2 rounded-xl">キャンセル</button>
                        <button type="submit" class="w-1/2 bg-amber-600 text-white font-bold py-2 rounded-xl">投稿する</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- フッターナビ -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-amber-100 flex justify-around p-3 shadow-lg z-50">
        <button onclick="switchView('home')" class="text-amber-600 font-bold text-sm">🏠 ホーム</button>
        <button onclick="switchView('post')" class="text-slate-400 font-bold text-sm">✍️ 投稿</button>
    </nav>

    <!-- Firebase SDK & 初期化 (nanikuu-v2専用) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCn8jK95Ubb1wz6RCDD3CAGM9ZA_R-zpPI",
            authDomain: "nanikuu-v2.firebaseapp.com",
            databaseURL: "https://nanikuu-v2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nanikuu-v2",
            storageBucket: "nanikuu-v2.fireappstorage.app",
            messagingSenderId: "302869563825",
            appId: "1:302869563825:web:d24dda2fc4c395eb811590",
            measurementId: "G-83PVL40HF8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ニックネーム管理
        let nickname = localStorage.getItem('nanikuu_nickname');
        if (!nickname) {
            nickname = 'ゲストさん_' + Math.floor(Math.random() * 1000);
            localStorage.setItem('nanikuu_nickname', nickname);
        }
        document.getElementById('user-display').innerText = '👤 ' + nickname;

        // 画面切り替え関数
        window.switchView = function(viewName) {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-post').classList.add('hidden');
            document.getElementById('view-' + viewName).classList.remove('hidden');
            window.scrollTo(0, 0);
        };

        // 投稿処理
        window.handlePost = function(e) {
            e.preventDefault();
            const name = document.getElementById('shop-name').value;
            const area = document.getElementById('shop-area').value;
            const comment = document.getElementById('shop-comment').value;

            const postsRef = ref(db, 'posts');
            const newPostRef = push(postsRef);
            set(newPostRef, {
                name: name,
                area: area,
                comment: comment,
                author: nickname,
                timestamp: Date.now()
            }).then(() => {
                document.getElementById('entry-form').reset();
                switchView('home');
            }).catch((error) => {
                alert('投稿に失敗しました: ' + error.message);
            });
        };

        // データのリアルタイム取得
        const postsRef = ref(db, 'posts');
        onValue(postsRef, (snapshot) => {
            const listEl = document.getElementById('post-list');
            const data = snapshot.val();
            if (!data) {
                listEl.innerHTML = '<p class="text-center text-slate-400 py-6">まだお店が投稿されていません。<br>最初の1店を投稿してみよう！</p>';
                return;
            }

            let html = '';
            const posts = Object.entries(data).reverse(); // 新しい順
            for (const [id, post] of posts) {
                html += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100 space-y-1">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-amber-900">${escapeHtml(post.name)}</h3>
                            <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">${escapeHtml(post.area)}</span>
                        </div>
                        <p class="text-sm text-slate-600">${escapeHtml(post.comment || '')}</p>
                        <div class="text-right text-xs text-slate-400 pt-1">投稿者: ${escapeHtml(post.author)}</div>
                    </div>
                `;
            }
            listEl.innerHTML = html;
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`"<>]/g, (match) => {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '"': '&quot;',
                    '<': '&lt;',
                    '>': '&gt;',
                }[match];
            });
        }
    </script>
</body>
</html>
