<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？ - 自分だけのグルメ手帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#121212', card: '#1e1e1e', input: '#2d2d2d', border: '#3f3f46', text: '#f3f4f6', muted: '#9ca3af' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet (無料の地図ライブラリ) のCSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 15px rgba(249, 115, 22, 0.6); transform: scale(1); }
            50% { text-shadow: 0 0 30px rgba(249, 115, 22, 0.9); transform: scale(1.03); }
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(249, 115, 22, 0.7); }
        }
        .anim-title { animation: pulseGlow 2s ease-in-out infinite; }
        .anim-icon { animation: floatIcon 1.5s ease-in-out infinite; }
        .anim-start-btn { animation: pulseBtn 2s ease-in-out infinite; }
        
        body { background-color: #121212; color: #f3f4f6; }

        /* 地図コンテナ */
        #map {
            width: 100%;
            height: 420px;
            border-radius: 1rem;
            z-index: 1;
        }

        /* 自然なリアル雲・霧レイヤー */
        .cloud-fog-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            transition: opacity 1s ease;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(1px);
            filter: url(#cloud-filter);
            mix-blend-mode: screen;
        }

        .cloud-base-overlay {
            position: absolute;
            inset: 0;
            z-index: 9;
            pointer-events: none;
            background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.2) 0%, rgba(100, 116, 139, 0.35) 100%);
            transition: opacity 1s ease;
        }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- SVGフィルター定義（リアルな雲の質感） -->
    <svg style="display:none;">
        <filter id="cloud-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" result="noise" />
            <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1.2 0" in="noise" result="monoNoise" />
            <feComposite operator="in" in2="SourceGraphic" />
        </filter>
    </svg>

    <div id="splash-screen" class="fixed inset-0 z-50 bg-dark-bg flex flex-col items-center justify-center p-6 text-center transition-opacity duration-700">
        <div class="space-y-6 max-w-sm w-full flex flex-col items-center">
            <div class="inline-block text-orange-500 text-5xl anim-icon mb-2">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <div class="space-y-2">
                <h1 class="text-3xl font-black tracking-widest text-white anim-title">なにクウ？</h1>
                <p class="text-xs text-orange-400 font-bold tracking-wider uppercase border-t border-b border-orange-500/30 py-1 inline-block px-4">- 日本全国 市区町村開拓手帳 -</p>
            </div>
            <p class="text-xs text-dark-muted">衛星写真に立ち込めるリアルな雲を晴らそう！</p>
            <div class="pt-6">

                    <span class="text-xs font-black tracking-widest uppercase text-amber-100">START</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ヘッダー -->

            </div>
            <div class="flex items-center space-x-2 bg-dark-input px-3 py-1.5 rounded-full border border-dark-border text-sm">

                <button onclick="changeUsername()" class="text-dark-muted hover:text-white transition"><i class="fa-solid fa-pen text-xs"></i></button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- リアル衛星マップセクション -->

            <div class="space-y-4">

    <!-- ルーレットモーダル -->
    <div id="roulette-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">

    <!-- スクリプト -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "nanikuu-v2.firebaseapp.com",
            databaseURL: "https://nanikuu-v2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nanikuu-v2",
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        function getDatabaseRef() { return firebase.database(); }

        var currentUserName = '';
        var allShops = [];
        var map;

        document.addEventListener('DOMContentLoaded', () => {
            initUser();
            initMap();
            loadShops();
        });

        function initMap() {
            map = L.map('map', { zoomControl: true }).setView([36.2048, 138.2529], 5);
            
            // 衛星写真タイル
            L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
                maxZoom: 18,
                attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>国土地理院</a>"
            }).addTo(map);

            // 都道府県境界線のGeoJSONデータをロードして重ねる
            fetch('https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson')
                .then(res => res.json())
                .then(data => {
                    L.geoJson(data, {
                        style: {
                            color: '#ffffff',       // 白い線
                            weight: 1,              // 線の太さ
                            opacity: 0.7,           // 線の透明度
                            fillColor: 'transparent', // 塗りつぶしなし
                            fillOpacity: 0
                        }
                    }).addTo(map);
                })
                .catch(err => console.log('都道府県境界データの読み込みに失敗しました', err));
        }

        function closeSplashScreen() {
            const splash = document.getElementById('splash-screen');
            splash.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => { splash.style.display = 'none'; }, 700);
        }

        function initUser() {
            const savedName = localStorage.getItem('nanikuu_web_username');
            if (savedName) currentUserName = savedName;
            else promptForUsername(true);
            updateUsernameDisplay();
        }

        function promptForUsername(isFirst = false) {
            const name = prompt(isFirst ? 'ニックネームを入力してください：' : '名前を変更：', currentUserName || '');
            if (name && name.trim() !== '') {
                currentUserName = name.trim();
                localStorage.setItem('nanikuu_web_username', currentUserName);
            } else if (isFirst) {
                currentUserName = 'ゲスト_' + Math.floor(Math.random() * 9000 + 1000);
                localStorage.setItem('nanikuu_web_username', currentUserName);
            }
            updateUsernameDisplay();
        }
        function changeUsername() { promptForUsername(false); }
        function updateUsernameDisplay() {
            const el = document.getElementById('display-username');
            if (el) el.textContent = currentUserName;
        }

        function loadShops() {
            getDatabaseRef().ref('shops').on('value', (snapshot) => {
                const data = snapshot.val();
                allShops = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        allShops.push({ id: key, ...data[key] });
                    });
                }
                allShops.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                document.getElementById('loading-spinner').classList.add('hidden');
                filterShops();
                updateCloudFog();
            });
        }

        function updateCloudFog() {
            const prefClearedMap = {};
            allShops.forEach(shop => {
                if (shop.pref && shop.city) {
                    if (!prefClearedMap[shop.pref]) prefClearedMap[shop.pref] = new Set();
                    prefClearedMap[shop.pref].add(shop.city.trim());
                }
            });

            let totalClearedCities = 0;
            Object.values(prefClearedMap).forEach(set => totalClearedCities += set.size);
            document.getElementById('exploration-rate').textContent = `発見市区町村: ${totalClearedCities}件`;

            const cloudFog = document.getElementById('cloud-fog');
            const cloudBase = document.getElementById('cloud-base');
            
            if (totalClearedCities > 0) {
                const clearFactor = Math.max(0.05, 0.55 - (totalClearedCities * 0.05));
                cloudFog.style.opacity = clearFactor;
                cloudBase.style.opacity = clearFactor;
            } else {
                cloudFog.style.opacity = 0.55;
                cloudBase.style.opacity = 0.55;
            }
        }

        function filterShops() {
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            const genre = document.getElementById('filter-genre').value;

            const filtered = allShops.filter(shop => {
                const matchKeyword = !keyword || 
                    (shop.name && shop.name.toLowerCase().includes(keyword)) ||
                    (shop.pref && shop.pref.toLowerCase().includes(keyword)) ||
                    (shop.city && shop.city.toLowerCase().includes(keyword)) ||
                    (shop.comment && shop.comment.toLowerCase().includes(keyword));
                const matchGenre = !genre || shop.genre === genre;
                return matchKeyword && matchGenre;
            });

            renderShops(filtered);
        }

        function renderShops(shops) {
            const listEl = document.getElementById('shop-list');
            const noDataEl = document.getElementById('no-data');
            document.getElementById('shop-count').textContent = shops.length;
            listEl.innerHTML = '';

            if (shops.length === 0) {
                noDataEl.classList.remove('hidden');
                return;
            }
            noDataEl.classList.add('hidden');

            shops.forEach(shop => {
                const itayoObj = shop.itayo || {};
                const itayoCount = Object.keys(itayoObj).length;
                const hasItayo = Object.values(itayoObj).some(name => name === currentUserName);

                const card = document.createElement('div');
                card.className = "bg-dark-card border border-dark-border rounded-xl overflow-hidden shadow-md flex flex-col justify-between";
                
                let imageHtml = shop.imageUrl 
                    ? `<div class="h-40 w-full overflow-hidden bg-dark-input"><img src="${shop.imageUrl}" class="w-full h-full object-cover"></div>`
                    : `<div class="h-20 w-full bg-dark-input flex items-center justify-center text-dark-muted"><i class="fa-solid fa-utensils text-xl opacity-40"></i></div>`;

                card.innerHTML = `
                    <div>
                        ${imageHtml}
                        <div class="p-4 space-y-2">
                            <div class="flex justify-between items-start">
                                <div class="flex flex-wrap gap-1 items-center">
                                    <span class="text-[10px] bg-orange-500/20 text-orange-400 font-bold px-2 py-0.5 rounded border border-orange-500/30">${shop.genre || 'その他'}</span>
                                    <span class="text-[10px] bg-dark-input text-dark-muted px-2 py-0.5 rounded border border-dark-border"><i class="fa-solid fa-map-pin text-orange-400 mr-1"></i>${shop.pref || ''} ${shop.city || ''}</span>
                                </div>
                                <div class="flex space-x-1">
                                    <button onclick="openEditModal('${shop.id}')" class="text-dark-muted hover:text-white p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteShop('${shop.id}')" class="text-dark-muted hover:text-red-400 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <h3 class="font-bold text-base text-gray-100">${escapeHtml(shop.name)}</h3>
                            ${shop.comment ? `<p class="text-xs text-dark-muted line-clamp-2">${escapeHtml(shop.comment)}</p>` : ''}
                        </div>
                    </div>
                    <div class="p-4 pt-0 border-t border-dark-border/40 mt-3 flex justify-between items-center bg-dark-card/50">
                        <span class="text-[11px] text-dark-muted">追加: ${shop.author || '不明'}</span>
                        <button onclick="toggleItayo('${shop.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 ${hasItayo ? 'bg-orange-500 text-white shadow-sm' : 'bg-dark-input hover:bg-dark-border text-dark-muted border border-dark-border'}">
                            <i class="fa-solid fa-check-circle"></i>
                            <span>イッタヨ！ (${itayoCount})</span>
                        </button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function openSearchModal() { document.getElementById('search-modal').classList.remove('hidden'); }
        function closeSearchModal() { document.getElementById('search-modal').classList.add('hidden'); }
        function openAddModal() {
            document.getElementById('modal-title').textContent = 'お店を追加する';
            document.getElementById('edit-shop-id').value = '';
            document.getElementById('shop-name').value = '';
            document.getElementById('shop-genre').value = '和食';
            document.getElementById('shop-pref').value = '東京都';
            document.getElementById('shop-city').value = '';
            document.getElementById('shop-comment').value = '';
            document.getElementById('shop-url').value = '';
            document.getElementById('shop-image').value = '';
            document.getElementById('image-upload-progress').classList.add('hidden');
            document.getElementById('shop-modal').classList.remove('hidden');
        }
        function openEditModal(id) {
            const shop = allShops.find(s => s.id === id);
            if (!shop) return;
            document.getElementById('modal-title').textContent = 'お店を編集する';
            document.getElementById('edit-shop-id').value = shop.id;
            document.getElementById('shop-name').value = shop.name || '';
            document.getElementById('shop-genre').value = shop.genre || '和食';
            document.getElementById('shop-pref').value = shop.pref || '東京都';
            document.getElementById('shop-city').value = shop.city || '';
            document.getElementById('shop-comment').value = shop.comment || '';
            document.getElementById('shop-url').value = shop.url || '';
            document.getElementById('shop-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('shop-modal').classList.add('hidden'); }

        async function saveShop() {
            const id = document.getElementById('edit-shop-id').value;
            const name = document.getElementById('shop-name').value.trim();
            const genre = document.getElementById('shop-genre').value;
            const pref = document.getElementById('shop-pref').value;
            const city = document.getElementById('shop-city').value.trim();
            const comment = document.getElementById('shop-comment').value.trim();
            const url = document.getElementById('shop-url').value.trim();
            const imageFile = document.getElementById('shop-image').files[0];

            if (!name) { alert('店名を入力してください。'); return; }
            if (!city) { alert('市区町村名を入力してください。'); return; }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            document.getElementById('image-upload-progress').classList.remove('hidden');

            try {
                let imageUrl = '';
                if (id) {
                    const existing = allShops.find(s => s.id === id);
                    if (existing && existing.imageUrl) imageUrl = existing.imageUrl;
                }
                if (imageFile) {
                    const resizedBlob = await resizeImage(imageFile, 250, 250, 0.4);
                    imageUrl = await convertBlobToBase64(resizedBlob);
                }

                const shopData = { name, genre, pref, city, comment, url, imageUrl, author: currentUserName };
                const shopsRef = getDatabaseRef().ref('shops');
                if (id) {
                    await shopsRef.child(id).update(shopData);
                } else {
                    shopData.createdAt = firebase.database.ServerValue.TIMESTAMP;
                    await shopsRef.push(shopData);
                }
                closeModal();
            } catch (e) {
                alert('保存に失敗しました: ' + (e.message || e));
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '保存する';
                document.getElementById('image-upload-progress').classList.add('hidden');
            }
        }

        function deleteShop(id) {
            if (confirm('このお店を削除しますか？')) getDatabaseRef().ref(`shops/${id}`).remove();
        }

        function toggleItayo(shopId) {
            const shopRef = getDatabaseRef().ref(`shops/${shopId}/itayo`);
            shopRef.once('value', (snapshot) => {
                const data = snapshot.val() || {};
                let userKey = null;
                Object.keys(data).forEach(k => { if (data[k] === currentUserName) userKey = k; });
                if (userKey) shopRef.child(userKey).remove();
                else shopRef.push(currentUserName);
            });
        }

        function openRouletteModal() {
            if (allShops.length === 0) { alert('お店がありません。'); return; }
            document.getElementById('roulette-modal').classList.remove('hidden');
            startRoulette();
        }
        function closeRouletteModal() { document.getElementById('roulette-modal').classList.add('hidden'); }
        function startRoulette() {
            const textEl = document.getElementById('roulette-text');
            const subEl = document.getElementById('roulette-sub');
            const btnEl = document.getElementById('roulette-btn');
            btnEl.disabled = true;
            let count = 0;
            const timer = setInterval(() => {
                const rand = allShops[Math.floor(Math.random() * allShops.length)];
                textEl.textContent = rand.name;
                subEl.textContent = `${rand.genre} / ${rand.pref} ${rand.city}`;
                count++;
                if (count >= 15) {
                    clearInterval(timer);
                    btnEl.disabled = false;
                }
            }, 80);
        }

        function resizeImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > maxWidth) { h *= maxWidth/w; w = maxWidth; } }
                        else { if (h > maxHeight) { w *= maxHeight/h; h = maxHeight; } }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        function convertBlobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onloadend = () => resolve(r.result);
                r.onerror = reject;
                r.readAsDataURL(blob);
            });
        }
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`"<>]/g, (m) => ({ '&': '&amp;', '"': '&quot;', '<': '&lt;', '>': '&gt;' }[m]));
        }
    </script>
</body>
</html>
