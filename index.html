<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？ - 自分だけのグルメ手帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#121212',
                            card: '#1e1e1e',
                            input: '#2d2d2d',
                            border: '#3f3f46',
                            text: '#f3f4f6',
                            muted: '#9ca3af'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 15px rgba(249, 115, 22, 0.6); transform: scale(1); }
            50% { text-shadow: 0 0 30px rgba(249, 115, 22, 0.9); transform: scale(1.03); }
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(249, 115, 22, 0.7); }
        }
        .anim-title { animation: pulseGlow 2s ease-in-out infinite; }
        .anim-icon { animation: floatIcon 1.5s ease-in-out infinite; }
        .anim-start-btn { animation: pulseBtn 2s ease-in-out infinite; }
        body { background-color: #121212; color: #f3f4f6; }
        .fog-pattern {
            background: repeating-linear-gradient(45deg, #1e293b, #1e293b 10px, #0f172a 10px, #0f172a 20px);
        }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- オープニング画面 -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-dark-bg flex flex-col items-center justify-center p-6 text-center transition-opacity duration-700">
        <div class="space-y-6 max-w-sm w-full flex flex-col items-center">
            <div class="inline-block text-orange-500 text-5xl anim-icon mb-2">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <div class="space-y-2">
                <h1 class="text-3xl font-black tracking-widest text-white anim-title">なにクウ？</h1>
                <p class="text-xs text-orange-400 font-bold tracking-wider uppercase border-t border-b border-orange-500/30 py-1 inline-block px-4">- 日本全国 市区町村開拓手帳 -</p>
            </div>
            <p class="text-xs text-dark-muted">都道府県をタップして、各地域の市区町村の霧を晴らそう！</p>
            <div class="pt-6">
                <button onclick="closeSplashScreen()" class="anim-start-btn group bg-gradient-to-b from-orange-500 to-amber-600 hover:from-orange-400 hover:to-amber-500 text-white w-28 h-28 rounded-full shadow-2xl flex flex-col items-center justify-center border-4 border-amber-300/60 transition transform active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-bowl-food text-3xl mb-1 text-amber-100"></i>
                    <span class="text-xs font-black tracking-widest uppercase text-amber-100">START</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="bg-dark-card border-b border-dark-border sticky top-0 z-40 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-utensils text-orange-500 text-xl"></i>
                <h1 class="text-lg font-bold tracking-wider">なにクウ？ <span class="text-xs bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-full border border-orange-500/30">Japan Edition</span></h1>
            </div>
            <div class="flex items-center space-x-2 bg-dark-input px-3 py-1.5 rounded-full border border-dark-border text-sm">
                <i class="fa-solid fa-user text-orange-400"></i>
                <span id="display-username" class="font-medium max-w-[100px] truncate">ゲスト</span>
                <button onclick="changeUsername()" class="text-dark-muted hover:text-white transition"><i class="fa-solid fa-pen text-xs"></i></button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- 日本地図・都道府県フォグオブウォーセクション -->
        <section class="bg-dark-card border border-dark-border rounded-2xl p-5 shadow-xl relative overflow-hidden">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-map-location-dot text-orange-400 text-lg"></i>
                        <h2 class="font-bold text-base text-white">日本地図 開拓ゲーム</h2>
                    </div>
                    <span id="exploration-rate" class="text-xs bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2.5 py-1 rounded-full font-bold">発見市区町村: 0件</span>
                </div>
                <p class="text-xs text-dark-muted">都道府県をタップすると、その県内の市町村ごとの「霧の晴れ具合」を確認できます。未投稿の地域の霧は晴れません！</p>
                
                <!-- 地方別セレクター -->
                <div class="space-y-3 pt-2" id="region-container">
                    <!-- 動的に地方・都道府県ボタンが生成されます -->
                </div>
            </div>
        </section>

        <!-- 飲食店リスト -->
        <div class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-dark-muted uppercase tracking-wider">登録されたお店 (<span id="shop-count">0</span>件)</h2>
            </div>
            
            <div id="loading-spinner" class="text-center py-12">

                <p class="text-xs text-dark-muted mt-2">データを読み込んでいます...</p>
            </div>

            <div id="shop-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

            <div id="no-data" class="hidden text-center py-12 bg-dark-card rounded-xl border border-dark-border">
                <i class="fa-solid fa-face-grimace text-3xl text-dark-muted mb-2"></i>
                <p class="text-sm text-dark-muted">条件に一致するお店が見つかりませんでした。</p>
            </div>
        </div>

    </main>

    <!-- フッターバー -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-dark-card/95 backdrop-blur-md border-t border-dark-border px-4 py-3 shadow-2xl">
        <div class="max-w-4xl mx-auto flex items-center justify-around gap-2">
            <button onclick="openSearchModal()" class="flex-1 bg-dark-input hover:bg-dark-border border border-dark-border text-dark-text font-medium py-3 px-2 rounded-xl text-xs transition flex flex-col sm:flex-row items-center justify-center gap-1">
                <i class="fa-solid fa-search text-orange-400 text-base"></i>
                <span>検索・絞り込み</span>
            </button>
            <button onclick="openRouletteModal()" class="w-16 bg-dark-input hover:bg-dark-border border border-orange-500/40 text-orange-400 font-medium py-3 px-2 rounded-xl transition flex items-center justify-center" title="ガチャ">
                <i class="fa-solid fa-dice text-2xl animate-bounce"></i>
            </button>
            <button onclick="openAddModal()" class="flex-1 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3 px-2 rounded-xl text-xs transition shadow-lg flex flex-col sm:flex-row items-center justify-center gap-1">
                <i class="fa-solid fa-plus-circle text-base"></i>
                <span>お店を追加</span>
            </button>
        </div>
    </nav>

    <!-- 都道府県詳細（市町村の霧状況）モーダル -->
    <div id="pref-detail-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card w-full max-w-md rounded-2xl border border-dark-border shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-dark-border flex justify-between items-center bg-dark-input">
                <h3 id="modal-pref-title" class="font-bold text-base text-orange-400">都道府県詳細</h3>
                <button onclick="closePrefModal()" class="text-dark-muted hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-5 overflow-y-auto space-y-3 flex-1" id="pref-detail-content">
                <!-- 市町村ごとの霧の晴れ具合リストが入ります -->
            </div>
            <div class="p-4 border-t border-dark-border bg-dark-input flex justify-end">
                <button onclick="closePrefModal()" class="px-5 py-2 rounded-lg text-sm bg-orange-500 hover:bg-orange-600 text-white font-bold transition">とじる</button>
            </div>
        </div>
    </div>

    <!-- 検索モーダル -->
    <div id="search-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-dark-card w-full max-w-lg rounded-t-2xl sm:rounded-2xl border border-dark-border shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-dark-border flex justify-between items-center bg-dark-input">
                <h3 class="font-bold text-base"><i class="fa-solid fa-search text-orange-400 mr-2"></i>お店を検索</h3>
                <button onclick="closeSearchModal()" class="text-dark-muted hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 space-y-4 overflow-y-auto">
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">フリーワード</label>
                    <input type="text" id="search-keyword" placeholder="店名・市区町村名など" oninput="filterShops()" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">ジャンル</label>
                    <select id="filter-genre" onchange="filterShops()" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                        <option value="">すべてのジャンル</option>
                        <option value="和食">和食</option><option value="洋食">洋食</option><option value="中華">中華</option><option value="ラーメン">ラーメン</option><option value="焼肉・肉料理">焼肉・肉料理</option><option value="居酒屋・バー">居酒屋・バー</option><option value="カフェ・スイーツ">カフェ・スイーツ</option><option value="エスニック・カレー">エスニック・カレー</option><option value="その他">その他</option>
                    </select>
                </div>
            </div>
            <div class="p-4 border-t border-dark-border bg-dark-input flex justify-end">
                <button onclick="closeSearchModal()" class="px-6 py-2 rounded-lg text-sm bg-orange-500 hover:bg-orange-600 text-white font-bold transition">完了</button>
            </div>
        </div>
    </div>

    <!-- お店追加・編集モーダル -->
    <div id="shop-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card w-full max-w-lg rounded-2xl border border-dark-border shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-dark-border flex justify-between items-center bg-dark-input">
                <h3 id="modal-title" class="font-bold text-base">お店を追加する</h3>
                <button onclick="closeModal()" class="text-dark-muted hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="edit-shop-id">
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">店名 <span class="text-orange-500">*</span></label>
                    <input type="text" id="shop-name" placeholder="例: レストラン〇〇" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-dark-muted mb-1">ジャンル <span class="text-orange-500">*</span></label>
                        <select id="shop-genre" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                            <option value="和食">和食</option><option value="洋食">洋食</option><option value="中華">中華</option><option value="ラーメン">ラーメン</option><option value="焼肉・肉料理">焼肉・肉料理</option><option value="居酒屋・バー">居酒屋・バー</option><option value="カフェ・スイーツ">カフェ・スイーツ</option><option value="エスニック・カレー">エスニック・カレー</option><option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-dark-muted mb-1">都道府県 <span class="text-orange-500">*</span></label>
                        <select id="shop-pref" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                            <!-- 47都道府県 -->
                            <option value="北海道">北海道</option><option value="青森県">青森県</option><option value="岩手県">岩手県</option><option value="宮城県">宮城県</option><option value="秋田県">秋田県</option><option value="山形県">山形県</option><option value="福島県">福島県</option>
                            <option value="茨城県">茨城県</option><option value="栃木県">栃木県</option><option value="群馬県">群馬県</option><option value="埼玉県">埼玉県</option><option value="千葉県">千葉県</option><option value="東京都" selected>東京都</option><option value="神奈川県">神奈川県</option>
                            <option value="新潟県">新潟県</option><option value="富山県">富山県</option><option value="石川県">石川県</option><option value="福井県">福井県</option><option value="山梨県">山梨県</option><option value="長野県">長野県</option>
                            <option value="岐阜県">岐阜県</option><option value="静岡県">静岡県</option><option value="愛知県">愛知県</option><option value="三重県">三重県</option>
                            <option value="滋賀県">滋賀県</option><option value="京都府">京都府</option><option value="大阪府">大阪府</option><option value="兵庫県">兵庫県</option><option value="奈良県">奈良県</option><option value="和歌山県">和歌山県</option>
                            <option value="鳥取県">鳥取県</option><option value="島根県">島根県</option><option value="岡山県">岡山県</option><option value="広島県">広島県</option><option value="山口県">山口県</option>
                            <option value="徳島県">徳島県</option><option value="香川県">香川県</option><option value="愛媛県">愛媛県</option><option value="高知県">高知県</option>
                            <option value="福岡県">福岡県</option><option value="佐賀県">佐賀県</option><option value="長崎県">長崎県</option><option value="熊本県">熊本県</option><option value="大分県">大分県</option><option value="宮崎県">宮崎県</option><option value="鹿児島県">鹿児島県</option><option value="沖縄県">沖縄県</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">市区町村名 <span class="text-orange-500">* (例: 渋谷区 / 名古屋市中村区)</span></label>
                    <input type="text" id="shop-city" placeholder="市区町村名を入力" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">おすすめメニュー・コメント</label>
                    <textarea id="shop-comment" rows="2" placeholder="感想など" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">参考URL</label>
                    <input type="url" id="shop-url" placeholder="https://..." class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">お店の写真</label>
                    <input type="file" id="shop-image" accept="image/*" class="w-full text-xs text-dark-muted file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-orange-500/20 file:text-orange-400 cursor-pointer">
                    <div id="image-upload-progress" class="hidden mt-2 text-xs text-orange-400">画像処理中...</div>
                </div>
            </div>
            <div class="p-4 border-t border-dark-border bg-dark-input flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm bg-dark-border hover:bg-dark-muted/30 transition">キャンセル</button>
                <button onclick="saveShop()" id="save-btn" class="px-5 py-2 rounded-lg text-sm bg-orange-500 hover:bg-orange-600 text-white font-bold transition">保存する</button>
            </div>
        </div>
    </div>

    <!-- ルーレットモーダル -->
    <div id="roulette-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card w-full max-w-md rounded-2xl border border-dark-border shadow-2xl p-6 text-center space-y-6">
            <h3 class="font-bold text-lg text-orange-400"><i class="fa-solid fa-dice mr-2"></i>今日のランチガチャ</h3>
            <div id="roulette-box" class="bg-dark-input border-2 border-orange-500/50 rounded-xl p-8 min-h-[140px] flex flex-col items-center justify-center space-y-2">
                <span id="roulette-text" class="text-xl font-bold text-gray-200">お店を選んでいます...</span>
                <span id="roulette-sub" class="text-xs text-dark-muted"></span>
            </div>
            <div class="flex space-x-3">
                <button onclick="closeRouletteModal()" class="flex-1 bg-dark-border hover:bg-dark-muted/30 py-2.5 rounded-lg text-sm transition">とじる</button>
                <button onclick="startRoulette()" id="roulette-btn" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-lg text-sm transition">もう一度回す</button>
            </div>
        </div>
    </div>

    <!-- スクリプト -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "nanikuu-v2.firebaseapp.com",
            databaseURL: "https://nanikuu-v2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nanikuu-v2",
            storageBucket: "nanikuu-v2.appspot.com",
            messagingSenderId: "374828190000",
            appId: "1:374828190000:web:..."
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        function getDatabaseRef() { return firebase.database(); }

        var currentUserName = '';
        var allShops = [];

        // 地方別の都道府県定義
        const regionGroups = [
            { region: "北海道・東北", prefs: ["北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県"] },
            { region: "関東", prefs: ["茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県"] },
            { region: "中部", prefs: ["新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県"] },
            { region: "近畿", prefs: ["三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県"] },
            { region: "中国・四国", prefs: ["鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県", "香川県", "愛媛県", "高知県"] },
            { region: "九州・沖縄", prefs: ["福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"] }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            initUser();
            loadShops();
        });

        function closeSplashScreen() {
            const splash = document.getElementById('splash-screen');
            splash.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => { splash.style.display = 'none'; }, 700);
        }

        function initUser() {
            const savedName = localStorage.getItem('nanikuu_web_username');
            if (savedName) currentUserName = savedName;
            else promptForUsername(true);
            updateUsernameDisplay();
        }

        function promptForUsername(isFirst = false) {
            const name = prompt(isFirst ? 'ニックネームを入力してください：' : '名前を変更：', currentUserName || '');
            if (name && name.trim() !== '') {
                currentUserName = name.trim();
                localStorage.setItem('nanikuu_web_username', currentUserName);
            } else if (isFirst) {
                currentUserName = 'ゲスト_' + Math.floor(Math.random() * 9000 + 1000);
                localStorage.setItem('nanikuu_web_username', currentUserName);
            }
            updateUsernameDisplay();
        }
        function changeUsername() { promptForUsername(false); }
        function updateUsernameDisplay() {
            const el = document.getElementById('display-username');
            if (el) el.textContent = currentUserName;
        }

        function loadShops() {
            getDatabaseRef().ref('shops').on('value', (snapshot) => {
                const data = snapshot.val();
                allShops = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        allShops.push({ id: key, ...data[key] });
                    });
                }
                allShops.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                document.getElementById('loading-spinner').classList.add('hidden');
                filterShops();
                renderRegionMap();
            });
        }

        // リアルな都道府県・地方ボードの描画（投稿された市区町村のみ霧が晴れる）
        function renderRegionMap() {
            const container = document.getElementById('region-container');
            container.innerHTML = '';

            // 投稿済みの市区町村マップを作成: pref -> Set(city)
            const prefClearedMap = {};
            allShops.forEach(shop => {
                if (shop.pref && shop.city) {
                    if (!prefClearedMap[shop.pref]) prefClearedMap[shop.pref] = new Set();
                    prefClearedMap[shop.pref].add(shop.city.trim());
                }
            });

            let totalClearedCities = 0;
            Object.values(prefClearedMap).forEach(set => totalClearedCities += set.size);
            document.getElementById('exploration-rate').textContent = `発見市区町村: ${totalClearedCities}件`;

            regionGroups.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = "space-y-1.5";
                
                let groupHtml = `<div class="text-xs font-bold text-orange-400 mb-1">${group.region}</div><div class="grid grid-cols-2 sm:grid-cols-4 gap-2">`;
                
                group.prefs.forEach(pref => {
                    const clearedSet = prefClearedMap[pref];
                    const hasCleared = clearedSet && clearedSet.size > 0;
                    const countText = hasCleared ? `${clearedSet.size}市区町村晴れ☀️` : '霧の中...';

                    if (hasCleared) {
                        // 晴れている都道府県ボタン
                        groupHtml += `
                            <button onclick="openPrefDetail('${pref}')" class="bg-gradient-to-br from-orange-500/20 to-amber-600/30 border border-orange-500/60 hover:border-orange-400 p-2 rounded-xl text-left transition flex flex-col justify-between shadow-sm cursor-pointer">
                                <span class="text-xs font-bold text-white flex items-center justify-between">
                                    <span>${pref}</span>
                                    <i class="fa-solid fa-sun text-orange-400 text-[10px]"></i>
                                </span>
                                <span class="text-[10px] text-orange-300 mt-1">${countText}</span>
                            </button>
                        `;
                    } else {
                        // 霧に包まれている都道府県ボタン
                        groupHtml += `
                            <button onclick="openPrefDetail('${pref}')" class="fog-pattern border border-dark-border hover:border-dark-muted p-2 rounded-xl text-left transition flex flex-col justify-between opacity-80 cursor-pointer">
                                <span class="text-xs font-bold text-dark-muted flex items-center justify-between">
                                    <span>${pref}</span>
                                    <i class="fa-solid fa-cloud text-dark-muted text-[10px]"></i>
                                </span>
                                <span class="text-[10px] text-dark-muted mt-1">未開拓 (タップで確認)</span>
                            </button>
                        `;
                    }
                });
                groupHtml += `</div>`;
                groupDiv.innerHTML = groupHtml;
                container.appendChild(groupDiv);
            });
        }

        // 都道府県タップ時：その中の市区町村の霧状況をモーダル表示
        function openPrefDetail(prefName) {
            document.getElementById('modal-pref-title').textContent = `${prefName} の開拓状況`;
            const contentEl = document.getElementById('pref-detail-content');
            contentEl.innerHTML = '';

            const prefShops = allShops.filter(s => s.pref === prefName);
            const clearedCityMap = {};
            prefShops.forEach(s => {
                if (s.city) {
                    const c = s.city.trim();
                    if (!clearedCityMap[c]) clearedCityMap[c] = [];
                    clearedCityMap[c].push(s);
                }
            });

            const clearedCities = Object.keys(clearedCityMap);

            if (clearedCities.length === 0) {
                contentEl.innerHTML = `
                    <div class="text-center py-8 space-y-2">
                        <i class="fa-solid fa-cloud-moon text-3xl text-dark-muted"></i>
                        <p class="text-sm font-bold text-white">${prefName}はまだ完全に霧に包まれています。</p>
                        <p class="text-xs text-dark-muted">この地域の市区町村のお店を投稿して、霧を晴らそう！</p>
                    </div>
                `;
            } else {
                let html = `<p class="text-xs text-dark-muted mb-2">投稿により霧が晴れた市区町村 (${clearedCities.length}件):</p><div class="space-y-2">`;
                clearedCities.forEach(city => {
                    const shopsInCity = clearedCityMap[city];
                    html += `
                        <div class="bg-dark-input border border-orange-500/30 rounded-xl p-3 space-y-1">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-orange-400"><i class="fa-solid fa-map-pin mr-1"></i>${city}</span>
                                <span class="text-[10px] bg-orange-500/20 text-orange-300 px-2 py-0.5 rounded-full">晴れ☀️</span>
                            </div>
                            <div class="text-[11px] text-dark-muted">登録店舗: ${shopsInCity.map(s => s.name).join(', ')}</div>
                        </div>
                    `;
                });
                html += `</div>`;
                contentEl.innerHTML = html;
            }

            document.getElementById('pref-detail-modal').classList.remove('hidden');
        }

        function closePrefModal() { document.getElementById('pref-detail-modal').classList.add('hidden'); }

        function filterShops() {
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            const genre = document.getElementById('filter-genre').value;

            const filtered = allShops.filter(shop => {
                const matchKeyword = !keyword || 
                    (shop.name && shop.name.toLowerCase().includes(keyword)) ||
                    (shop.pref && shop.pref.toLowerCase().includes(keyword)) ||
                    (shop.city && shop.city.toLowerCase().includes(keyword)) ||
                    (shop.comment && shop.comment.toLowerCase().includes(keyword));
                const matchGenre = !genre || shop.genre === genre;
                return matchKeyword && matchGenre;
            });

            renderShops(filtered);
        }

        function renderShops(shops) {
            const listEl = document.getElementById('shop-list');
            const noDataEl = document.getElementById('no-data');
            document.getElementById('shop-count').textContent = shops.length;
            listEl.innerHTML = '';

            if (shops.length === 0) {
                noDataEl.classList.remove('hidden');
                return;
            }
            noDataEl.classList.add('hidden');

            shops.forEach(shop => {
                const itayoObj = shop.itayo || {};
                const itayoCount = Object.keys(itayoObj).length;
                const hasItayo = Object.values(itayoObj).some(name => name === currentUserName);

                const card = document.createElement('div');
                card.className = "bg-dark-card border border-dark-border rounded-xl overflow-hidden shadow-md flex flex-col justify-between";
                
                let imageHtml = shop.imageUrl 
                    ? `<div class="h-40 w-full overflow-hidden bg-dark-input"><img src="${shop.imageUrl}" class="w-full h-full object-cover"></div>`
                    : `<div class="h-20 w-full bg-dark-input flex items-center justify-center text-dark-muted"><i class="fa-solid fa-utensils text-xl opacity-40"></i></div>`;

                card.innerHTML = `
                    <div>
                        ${imageHtml}
                        <div class="p-4 space-y-2">
                            <div class="flex justify-between items-start">
                                <div class="flex flex-wrap gap-1 items-center">
                                    <span class="text-[10px] bg-orange-500/20 text-orange-400 font-bold px-2 py-0.5 rounded border border-orange-500/30">${shop.genre || 'その他'}</span>
                                    <span class="text-[10px] bg-dark-input text-dark-muted px-2 py-0.5 rounded border border-dark-border"><i class="fa-solid fa-map-pin text-orange-400 mr-1"></i>${shop.pref || ''} ${shop.city || ''}</span>
                                </div>
                                <div class="flex space-x-1">
                                    <button onclick="openEditModal('${shop.id}')" class="text-dark-muted hover:text-white p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteShop('${shop.id}')" class="text-dark-muted hover:text-red-400 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <h3 class="font-bold text-base text-gray-100">${escapeHtml(shop.name)}</h3>
                            ${shop.comment ? `<p class="text-xs text-dark-muted line-clamp-2">${escapeHtml(shop.comment)}</p>` : ''}
                        </div>
                    </div>
                    <div class="p-4 pt-0 border-t border-dark-border/40 mt-3 flex justify-between items-center bg-dark-card/50">
                        <span class="text-[11px] text-dark-muted">追加: ${shop.author || '不明'}</span>
                        <button onclick="toggleItayo('${shop.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 ${hasItayo ? 'bg-orange-500 text-white shadow-sm' : 'bg-dark-input hover:bg-dark-border text-dark-muted border border-dark-border'}">
                            <i class="fa-solid fa-check-circle"></i>
                            <span>イッタヨ！ (${itayoCount})</span>
                        </button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function openSearchModal() { document.getElementById('search-modal').classList.remove('hidden'); }
        function closeSearchModal() { document.getElementById('search-modal').classList.add('hidden'); }
        function openAddModal() {
            document.getElementById('modal-title').textContent = 'お店を追加する';
            document.getElementById('edit-shop-id').value = '';
            document.getElementById('shop-name').value = '';
            document.getElementById('shop-genre').value = '和食';
            document.getElementById('shop-pref').value = '東京都';
            document.getElementById('shop-city').value = '';
            document.getElementById('shop-comment').value = '';
            document.getElementById('shop-url').value = '';
            document.getElementById('shop-image').value = '';
            document.getElementById('image-upload-progress').classList.add('hidden');
            document.getElementById('shop-modal').classList.remove('hidden');
        }
        function openEditModal(id) {
            const shop = allShops.find(s => s.id === id);
            if (!shop) return;
            document.getElementById('modal-title').textContent = 'お店を編集する';
            document.getElementById('edit-shop-id').value = shop.id;
            document.getElementById('shop-name').value = shop.name || '';
            document.getElementById('shop-genre').value = shop.genre || '和食';
            document.getElementById('shop-pref').value = shop.pref || '東京都';
            document.getElementById('shop-city').value = shop.city || '';
            document.getElementById('shop-comment').value = shop.comment || '';
            document.getElementById('shop-url').value = shop.url || '';
            document.getElementById('shop-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('shop-modal').classList.add('hidden'); }

        async function saveShop() {
            const id = document.getElementById('edit-shop-id').value;
            const name = document.getElementById('shop-name').value.trim();
            const genre = document.getElementById('shop-genre').value;
            const pref = document.getElementById('shop-pref').value;
            const city = document.getElementById('shop-city').value.trim();
            const comment = document.getElementById('shop-comment').value.trim();
            const url = document.getElementById('shop-url').value.trim();
            const imageFile = document.getElementById('shop-image').files[0];

            if (!name) { alert('店名を入力してください。'); return; }
            if (!city) { alert('市区町村名を入力してください（霧を晴らすために必要です）。'); return; }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            document.getElementById('image-upload-progress').classList.remove('hidden');

            try {
                let imageUrl = '';
                if (id) {
                    const existing = allShops.find(s => s.id === id);
                    if (existing && existing.imageUrl) imageUrl = existing.imageUrl;
                }
                if (imageFile) {
                    const resizedBlob = await resizeImage(imageFile, 250, 250, 0.4);
                    imageUrl = await convertBlobToBase64(resizedBlob);
                }

                const shopData = { name, genre, pref, city, comment, url, imageUrl, author: currentUserName };
                const shopsRef = getDatabaseRef().ref('shops');
                if (id) {
                    await shopsRef.child(id).update(shopData);
                } else {
                    shopData.createdAt = firebase.database.ServerValue.TIMESTAMP;
                    await shopsRef.push(shopData);
                }
                closeModal();
            } catch (e) {
                alert('保存に失敗しました: ' + (e.message || e));
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '保存する';
                document.getElementById('image-upload-progress').classList.add('hidden');
            }
        }

        function deleteShop(id) {
            if (confirm('このお店を削除しますか？')) getDatabaseRef().ref(`shops/${id}`).remove();
        }

        function toggleItayo(shopId) {
            const shopRef = getDatabaseRef().ref(`shops/${shopId}/itayo`);
            shopRef.once('value', (snapshot) => {
                const data = snapshot.val() || {};
                let userKey = null;
                Object.keys(data).forEach(k => { if (data[k] === currentUserName) userKey = k; });
                if (userKey) shopRef.child(userKey).remove();
                else shopRef.push(currentUserName);
            });
        }

        function openRouletteModal() {
            if (allShops.length === 0) { alert('お店がありません。'); return; }
            document.getElementById('roulette-modal').classList.remove('hidden');
            startRoulette();
        }
        function closeRouletteModal() { document.getElementById('roulette-modal').classList.add('hidden'); }
        function startRoulette() {
            const textEl = document.getElementById('roulette-text');
            const subEl = document.getElementById('roulette-sub');
            const btnEl = document.getElementById('roulette-btn');
            btnEl.disabled = true;
            let count = 0;
            const timer = setInterval(() => {
                const rand = allShops[Math.floor(Math.random() * allShops.length)];
                textEl.textContent = rand.name;
                subEl.textContent = `${rand.genre} / ${rand.pref} ${rand.city}`;
                count++;
                if (count >= 15) {
                    clearInterval(timer);
                    btnEl.disabled = false;
                }
            }, 80);
        }

        function resizeImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > maxWidth) { h *= maxWidth/w; w = maxWidth; } }
                        else { if (h > maxHeight) { w *= maxHeight/h; h = maxHeight; } }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        function convertBlobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onloadend = () => resolve(r.result);
                r.onerror = reject;
                r.readAsDataURL(blob);
            });
        }
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`"<>]/g, (m) => ({ '&': '&amp;', '"': '&quot;', '<': '&lt;', '>': '&gt;' }[m]));
        }
    </script>
</body>
</html>
