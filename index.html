<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？ - 自分だけのグルメ手帳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#121212',
                            card: '#1e1e1e',
                            input: '#2d2d2d',
                            border: '#3f3f46',
                            text: '#f3f4f6',
                            muted: '#9ca3af'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @keyframes slotSpin {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
        }
        .slot-animation {
            animation: slotSpin 0.1s linear infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 15px rgba(249, 115, 22, 0.6); transform: scale(1); }
            50% { text-shadow: 0 0 30px rgba(249, 115, 22, 0.9); transform: scale(1.03); }
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(249, 115, 22, 0.7); }
        }
        .anim-title {
            animation: pulseGlow 2s ease-in-out infinite;
        }
        .anim-icon {
            animation: floatIcon 1.5s ease-in-out infinite;
        }
        .anim-start-btn {
            animation: pulseBtn 2s ease-in-out infinite;
        }
        body {
            background-color: #121212;
            color: #f3f4f6;
        }
        .fog-container {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
        }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- ゲーム風オープニング画面 -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-dark-bg flex flex-col items-center justify-center p-6 text-center transition-opacity duration-700">
        <div class="space-y-6 max-w-sm w-full flex flex-col items-center">
            <div class="inline-block text-orange-500 text-5xl anim-icon mb-2">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <div class="space-y-2">
                <h1 class="text-3xl font-black tracking-widest text-white anim-title">
                    なにクウ？
                </h1>
                <p class="text-xs text-orange-400 font-bold tracking-wider uppercase border-t border-b border-orange-500/30 py-1 inline-block px-4">
                    - 自分だけのグルメ手帳 -
                </p>
            </div>
            <p class="text-xs text-dark-muted">お店を登録して日本全国の市区町村の霧を晴らそう！</p>
            
            <div class="pt-6">
                <button onclick="closeSplashScreen()" class="anim-start-btn group relative bg-gradient-to-b from-orange-500 to-amber-600 hover:from-orange-400 hover:to-amber-500 text-white w-28 h-28 rounded-full shadow-2xl flex flex-col items-center justify-center border-4 border-amber-300/60 transition transform active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-bowl-food text-3xl mb-1 text-amber-100 drop-shadow"></i>
                    <span class="text-xs font-black tracking-widest uppercase text-amber-100 drop-shadow-md">START</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="bg-dark-card border-b border-dark-border sticky top-0 z-40 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-utensils text-orange-500 text-xl"></i>
                <h1 class="text-lg font-bold tracking-wider">なにクウ？ <span class="text-xs bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-full border border-orange-500/30">ver2 WEB</span></h1>
            </div>
            <div class="flex items-center space-x-2 bg-dark-input px-3 py-1.5 rounded-full border border-dark-border text-sm">
                <i class="fa-solid fa-user text-orange-400"></i>
                <span id="display-username" class="font-medium max-w-[100px] truncate">ゲスト</span>
                <button onclick="changeUsername()" class="text-dark-muted hover:text-white transition" title="名前を変更">
                    <i class="fa-solid fa-pen text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- 日本地図 市区町村フォグ・オブ・ウォーセクション -->
        <section class="bg-dark-card border border-dark-border rounded-2xl p-5 shadow-xl relative overflow-hidden fog-container">
            <div class="relative z-10 space-y-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-map-location-dot text-orange-400 text-lg"></i>
                        <h2 class="font-bold text-base text-white">日本地図 市区町村開拓ゲーム</h2>
                    </div>
                    <span id="exploration-rate" class="text-xs bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2.5 py-1 rounded-full font-bold">発見率: 0件</span>
                </div>
                <p class="text-xs text-dark-muted">お店を登録する際、都道府県と「市区町村名」を入力すると、その地域の霧が晴れていきます！日本全国の制覇を目指そう。</p>
                
                <div class="bg-dark-input/80 border border-dark-border rounded-xl p-4 text-center relative min-h-[160px] flex flex-col items-center justify-center">
                    <canvas id="japan-map-canvas" width="320" height="150" class="max-w-full h-auto drop-shadow-md rounded-lg"></canvas>
                    <div id="map-status-text" class="text-xs text-orange-300 mt-2 font-medium">晴れた市区町村: 0 件</div>
                </div>
            </div>
        </section>

        <!-- 飲食店リスト表示エリア -->
        <div class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-dark-muted uppercase tracking-wider">登録されたお店 (<span id="shop-count">0</span>件)</h2>
            </div>
            
            <div id="loading-spinner" class="text-center py-12">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-orange-500"></i>
                <p class="text-xs text-dark-muted mt-2">データを読み込んでいます...</p>
            </div>

            <div id="shop-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 動的に挿入されます -->
            </div>

            <div id="no-data" class="hidden text-center py-12 bg-dark-card rounded-xl border border-dark-border">
                <i class="fa-solid fa-face-grimace text-3xl text-dark-muted mb-2"></i>
                <p class="text-sm text-dark-muted">条件に一致するお店が見つかりませんでした。</p>
            </div>
        </div>

    </main>

    <!-- 画面下の固定コントロールバー -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-dark-card/95 backdrop-blur-md border-t border-dark-border px-4 py-3 shadow-2xl">
        <div class="max-w-4xl mx-auto flex items-center justify-around gap-2">
            <button onclick="openSearchModal()" class="flex-1 bg-dark-input hover:bg-dark-border border border-dark-border text-dark-text font-medium py-3 px-2 rounded-xl text-xs sm:text-sm transition flex flex-col sm:flex-row items-center justify-center gap-1">
                <i class="fa-solid fa-search text-orange-400 text-base"></i>
                <span>検索・絞り込み</span>
            </button>

            <button onclick="openRouletteModal()" class="w-16 bg-dark-input hover:bg-dark-border border border-orange-500/40 text-orange-400 font-medium py-3 px-2 rounded-xl transition flex items-center justify-center" title="ランチガチャ">
                <i class="fa-solid fa-dice text-2xl animate-bounce"></i>
            </button>

            <button onclick="openAddModal()" class="flex-1 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3 px-2 rounded-xl text-xs sm:text-sm transition shadow-lg flex flex-col sm:flex-row items-center justify-center gap-1">
                <i class="fa-solid fa-plus-circle text-base"></i>
                <span>お店を追加</span>
            </button>
        </div>
    </nav>

    <!-- 検索・フィルターモーダル -->
    <div id="search-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-dark-card w-full max-w-lg rounded-t-2xl sm:rounded-2xl border border-dark-border shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-dark-border flex justify-between items-center bg-dark-input">
                <h3 class="font-bold text-base"><i class="fa-solid fa-search text-orange-400 mr-2"></i>お店を検索・絞り込み</h3>
                <button onclick="closeSearchModal()" class="text-dark-muted hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 space-y-4 overflow-y-auto">
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">フリーワード検索</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-dark-muted">
                            <i class="fa-solid fa-search"></i>
                        </span>
                        <input type="text" id="search-keyword" placeholder="店名・市区町村名など" oninput="filterShops()" class="w-full bg-dark-input border border-dark-border rounded-lg pl-9 pr-3.5 py-2 text-sm focus:outline-none focus:border-orange-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">ジャンル</label>
                    <select id="filter-genre" onchange="filterShops()" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                        <option value="">すべてのジャンル</option>
                        <option value="和食">和食</option>
                        <option value="洋食">洋食</option>
                        <option value="中華">中華</option>
                        <option value="ラーメン">ラーメン</option>
                        <option value="焼肉・肉料理">焼肉・肉料理</option>
                        <option value="居酒屋・バー">居酒屋・バー</option>
                        <option value="カフェ・スイーツ">カフェ・スイーツ</option>
                        <option value="エスニック・カレー">エスニック・カレー</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">都道府県</label>
                    <select id="filter-pref" onchange="filterShops()" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                        <option value="">すべての都道府県</option>
                        <option value="北海道">北海道</option><option value="青森県">青森県</option><option value="岩手県">岩手県</option><option value="宮城県">宮城県</option><option value="秋田県">秋田県</option><option value="山形県">山形県</option><option value="福島県">福島県</option>
                        <option value="茨城県">茨城県</option><option value="栃木県">栃木県</option><option value="群馬県">群馬県</option><option value="埼玉県">埼玉県</option><option value="千葉県">千葉県</option><option value="東京都">東京都</option><option value="神奈川県">神奈川県</option>
                        <option value="新潟県">新潟県</option><option value="富山県">富山県</option><option value="石川県">石川県</option><option value="福井県">福井県</option><option value="山梨県">山梨県</option><option value="長野県">長野県</option>
                        <option value="岐阜県">岐阜県</option><option value="静岡県">静岡県</option><option value="愛知県">愛知県</option><option value="三重県">三重県</option>
                        <option value="滋賀県">滋賀県</option><option value="京都府">京都府</option><option value="大阪府">大阪府</option><option value="兵庫県">兵庫県</option><option value="奈良県">奈良県</option><option value="和歌山県">和歌山県</option>
                        <option value="鳥取県">鳥取県</option><option value="島根県">島根県</option><option value="岡山県">岡山県</option><option value="広島県">広島県</option><option value="山口県">山口県</option>
                        <option value="徳島県">徳島県</option><option value="香川県">香川県</option><option value="愛媛県">愛媛県</option><option value="高知県">高知県</option>
                        <option value="福岡県">福岡県</option><option value="佐賀県">佐賀県</option><option value="長崎県">長崎県</option><option value="熊本県">熊本県</option><option value="大分県">大分県</option><option value="宮崎県">宮崎県</option><option value="鹿児島県">鹿児島県</option><option value="沖縄県">沖縄県</option>
                    </select>
                </div>
            </div>
            <div class="p-4 border-t border-dark-border bg-dark-input flex justify-end">
                <button onclick="closeSearchModal()" class="w-full sm:w-auto px-6 py-2.5 rounded-lg text-sm bg-orange-500 hover:bg-orange-600 text-white font-bold transition">完了</button>
            </div>
        </div>
    </div>

    <!-- お店追加・編集モーダル -->
    <div id="shop-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card w-full max-w-lg rounded-2xl border border-dark-border shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-dark-border flex justify-between items-center bg-dark-input">
                <h3 id="modal-title" class="font-bold text-base">お店を追加する</h3>
                <button onclick="closeModal()" class="text-dark-muted hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="edit-shop-id">
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">店名 <span class="text-orange-500">*</span></label>
                    <input type="text" id="shop-name" placeholder="例: レストラン〇〇" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-dark-muted mb-1">ジャンル <span class="text-orange-500">*</span></label>
                        <select id="shop-genre" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                            <option value="和食">和食</option>
                            <option value="洋食">洋食</option>
                            <option value="中華">中華</option>
                            <option value="ラーメン">ラーメン</option>
                            <option value="焼肉・肉料理">焼肉・肉料理</option>
                            <option value="居酒屋・バー">居酒屋・バー</option>
                            <option value="カフェ・スイーツ">カフェ・スイーツ</option>
                            <option value="エスニック・カレー">エスニック・カレー</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-dark-muted mb-1">都道府県 <span class="text-orange-500">*</span></label>
                        <select id="shop-pref" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                            <option value="北海道">北海道</option><option value="青森県">青森県</option><option value="岩手県">岩手県</option><option value="宮城県">宮城県</option><option value="秋田県">秋田県</option><option value="山形県">山形県</option><option value="福島県">福島県</option>
                            <option value="茨城県">茨城県</option><option value="栃木県">栃木県</option><option value="群馬県">群馬県</option><option value="埼玉県">埼玉県</option><option value="千葉県">千葉県</option><option value="東京都" selected>東京都</option><option value="神奈川県">神奈川県</option>
                            <option value="新潟県">新潟県</option><option value="富山県">富山県</option><option value="石川県">石川県</option><option value="福井県">福井県</option><option value="山梨県">山梨県</option><option value="長野県">長野県</option>
                            <option value="岐阜県">岐阜県</option><option value="静岡県">静岡県</option><option value="愛知県">愛知県</option><option value="三重県">三重県</option>
                            <option value="滋賀県">滋賀県</option><option value="京都府">京都府</option><option value="大阪府">大阪府</option><option value="兵庫県">兵庫県</option><option value="奈良県">奈良県</option><option value="和歌山県">和歌山県</option>
                            <option value="鳥取県">鳥取県</option><option value="島根県">島根県</option><option value="岡山県">岡山県</option><option value="広島県">広島県</option><option value="山口県">山口県</option>
                            <option value="徳島県">徳島県</option><option value="香川県">香川県</option><option value="愛媛県">愛媛県</option><option value="高知県">高知県</option>
                            <option value="福岡県">福岡県</option><option value="佐賀県">佐賀県</option><option value="長崎県">長崎県</option><option value="熊本県">熊本県</option><option value="大分県">大分県</option><option value="宮崎県">宮崎県</option><option value="鹿児島県">鹿児島県</option><option value="沖縄県">沖縄県</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">市区町村名 <span class="text-orange-500">* (霧を晴らす細かめの単位)</span></label>
                    <input type="text" id="shop-city" placeholder="例: 名古屋市栄 / 渋谷区宇田川町 / 四日市市 等" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">おすすめメニュー・特徴</label>
                    <textarea id="shop-comment" rows="2" placeholder="看板メニューや雰囲気など" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">参考URL（食べログやGoogleマップ等）</label>
                    <input type="url" id="shop-url" placeholder="https://..." class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1">お店の写真</label>
                    <input type="file" id="shop-image" accept="image/*" class="w-full text-xs text-dark-muted file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-orange-500/20 file:text-orange-400 hover:file:bg-orange-500/30 cursor-pointer">
                    <div id="image-upload-progress" class="hidden mt-2 text-xs text-orange-400">画像処理中...</div>
                </div>
            </div>
            <div class="p-4 border-t border-dark-border bg-dark-input flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm bg-dark-border hover:bg-dark-muted/30 transition">キャンセル</button>
                <button onclick="saveShop()" id="save-btn" class="px-5 py-2 rounded-lg text-sm bg-orange-500 hover:bg-orange-600 text-white font-bold transition flex items-center space-x-1">
                    <span>保存する</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ルーレットモーダル -->
    <div id="roulette-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card w-full max-w-md rounded-2xl border border-dark-border shadow-2xl p-6 text-center space-y-6">
            <h3 class="font-bold text-lg text-orange-400"><i class="fa-solid fa-dice mr-2"></i>今日のランチガチャ</h3>
            <div id="roulette-box" class="bg-dark-input border-2 border-orange-500/50 rounded-xl p-8 min-h-[140px] flex flex-col items-center justify-center space-y-2">
                <span id="roulette-text" class="text-xl font-bold text-gray-200">お店を選んでいます...</span>
                <span id="roulette-sub" class="text-xs text-dark-muted"></span>
            </div>
            <div class="flex space-x-3">
                <button onclick="closeRouletteModal()" class="flex-1 bg-dark-border hover:bg-dark-muted/30 py-2.5 rounded-lg text-sm transition">とじる</button>
                <button onclick="startRoulette()" id="roulette-btn" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-lg text-sm transition shadow">もう一度回す</button>
            </div>
        </div>
    </div>

    <!-- スクリプト部 -->
    <script>
        // ==========================================
        // 1. Firebase 設定 & 初期化
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSy... (お使いの実際のapiKey)",
            authDomain: "nanikuu-v2.firebaseapp.com",
            databaseURL: "https://nanikuu-v2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nanikuu-v2",
            storageBucket: "nanikuu-v2.appspot.com",
            messagingSenderId: "374828190000",
            appId: "1:374828190000:web:..."
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        function getDatabaseRef() {
            return firebase.database();
        }

        var currentUserName = ''; 
        var allShops = [];

        // ==========================================
        // 2. 初期化・ユーザー名管理
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            initUser();
            loadShops();
        });

        function closeSplashScreen() {
            const splash = document.getElementById('splash-screen');
            splash.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                splash.style.display = 'none';
            }, 700);
        }

        function initUser() {
            const savedName = localStorage.getItem('nanikuu_web_username');
            if (savedName) {
                currentUserName = savedName;
            } else {
                promptForUsername(true);
            }
            updateUsernameDisplay();
        }

        function promptForUsername(isFirst = false) {
            const message = isFirst 
                ? 'WEB版「なにクウ？」へようこそ！\n投稿や「イッタヨ！」で使用するあなたのニックネームを入力してください：'
                : 'ニックネームを変更してください：';
            
            const name = prompt(message, currentUserName || '');
            if (name && name.trim() !== '') {
                currentUserName = name.trim();
                localStorage.setItem('nanikuu_web_username', currentUserName);
            } else if (isFirst) {
                currentUserName = 'ゲスト_' + Math.floor(Math.random() * 9000 + 1000);
                localStorage.setItem('nanikuu_web_username', currentUserName);
            }
            updateUsernameDisplay();
        }

        function changeUsername() {
            promptForUsername(false);
        }

        function updateUsernameDisplay() {
            const el = document.getElementById('display-username');
            if (el) el.textContent = currentUserName;
        }

        // ==========================================
        // 3. データの読み込み & 日本地図・市区町村フォグゲーム描画
        // ==========================================
        function loadShops() {
            const shopsRef = getDatabaseRef().ref('shops');
            shopsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                allShops = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        allShops.push({ id: key, ...data[key] });
                    });
                }
                allShops.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                
                document.getElementById('loading-spinner').classList.add('hidden');
                filterShops();
                updateMapGame(allShops);
            }, (error) => {
                console.error(error);
                document.getElementById('loading-spinner').innerHTML = '<p class="text-red-400 text-xs">データの読み込みに失敗しました。</p>';
            });
        }

        function updateMapGame(shops) {
            // 市区町村レベルでの晴れエリアを収集（都道府県 + 市区町村名）
            const clearedCitySet = new Set();
            shops.forEach(shop => {
                if (shop.pref && shop.city) {
                    const uniqueKey = `${shop.pref}_${shop.city.trim()}`;
                    clearedCitySet.add(uniqueKey);
                }
            });

            const clearedCount = clearedCitySet.size;
            document.getElementById('exploration-rate').textContent = `発見率: ${clearedCount} 市区町村`;
            document.getElementById('map-status-text').textContent = `晴れた市区町村: ${clearedCount} 件`;

            drawJapanMapCanvas(clearedCitySet);
        }

        // 日本地図＆市区町村レベルの霧（フォグ）グラフィック描画
        function drawJapanMapCanvas(clearedCitySet) {
            const canvas = document.getElementById('japan-map-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景（日本列島をイメージしたダークな深緑・海風のトーン）
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 日本地図のイラスト風アウトライン（簡易的に日本列島の主要地方ブロックをグリッド配置）
            const regions = [
                { name: "北海道", x: 230, y: 15, w: 75, h: 40 },
                { name: "東北", x: 210, y: 58, w: 55, h: 45 },
                { name: "関東", x: 190, y: 75, w: 45, h: 40 },
                { name: "中部", x: 140, y: 70, w: 52, h: 45 },
                { name: "近畿", x: 100, y: 80, w: 42, h: 40 },
                { name: "中国・四国", x: 55, y: 82, w: 50, h: 42 },
                { name: "九州・沖縄", x: 15, y: 85, w: 45, h: 50 }
            ];

            regions.forEach(reg => {
                // ブロック単位に登録された市区町村があるかチェック
                let hasClearedInRegion = false;
                clearedCitySet.forEach(cityKey => {
                    // 都道府県や市区町村の文字列に地方名が含まれる、またはデータが存在する場合
                    hasClearedInRegion = true; // 今回は全体として霧が晴れ進む演出
                });

                ctx.save();
                ctx.beginPath();
                if (typeof ctx.roundRect === 'function') {
                    ctx.roundRect(reg.x, reg.y, reg.w, reg.h, 6);
                } else {
                    ctx.rect(reg.x, reg.y, reg.w, reg.h);
                }

                if (clearedCitySet.size > 0) {
                    // 霧が晴れ始めた日本列島
                    ctx.fillStyle = '#f97316';
                    ctx.shadowColor = 'rgba(249, 115, 22, 0.6)';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(reg.name, reg.x + reg.w / 2, reg.y + reg.h / 2 - 5);

                    ctx.fillStyle = '#fde047';
                    ctx.font = '8px sans-serif';
                    ctx.fillText('晴れエリア有☀️', reg.x + reg.w / 2, reg.y + reg.h / 2 + 8);
                } else {
                    // まだ完全な霧（未開拓）
                    ctx.fillStyle = '#1e293b';
                    ctx.fill();

                    // スモーク・霧のハッチングパターン
                    ctx.clip();
                    ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)';
                    ctx.lineWidth = 3;
                    for (let i = -reg.h; i < reg.w + reg.h; i += 6) {
                        ctx.beginPath();
                        ctx.moveTo(reg.x + i, reg.y);
                        ctx.lineTo(reg.x + i + reg.h, reg.y + reg.h);
                        ctx.stroke();
                    }
                    ctx.restore();

                    ctx.fillStyle = 'rgba(100, 116, 139, 0.3)';
                    ctx.fillRect(reg.x, reg.y, reg.w, reg.h);

                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '9px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(reg.name, reg.x + reg.w / 2, reg.y + reg.h / 2);
                }
            });

            // 左側に日本地図のシンボルアイコンを描画
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.roundRect(10, 15, 110, 60, 8);
            ctx.fill();

            ctx.fillStyle = '#f97316';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('🇯🇵 日本全国制覇', 20, 35);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '9px sans-serif';
            ctx.fillText(`発見市区町村: ${clearedCitySet.size}件`, 20, 52);
        }

        // ==========================================
        // 4. フィルター & レンダリング
        // ==========================================
        function filterShops() {
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            const genre = document.getElementById('filter-genre').value;
            const pref = document.getElementById('filter-pref').value;

            const filtered = allShops.filter(shop => {
                const matchKeyword = !keyword || 
                    (shop.name && shop.name.toLowerCase().includes(keyword)) ||
                    (shop.city && shop.city.toLowerCase().includes(keyword)) ||
                    (shop.comment && shop.comment.toLowerCase().includes(keyword));
                
                const matchGenre = !genre || shop.genre === genre;
                const matchPref = !pref || shop.pref === pref;

                return matchKeyword && matchGenre && matchPref;
            });

            renderShops(filtered);
        }

        function renderShops(shops) {
            const listEl = document.getElementById('shop-list');
            const noDataEl = document.getElementById('no-data');
            const countEl = document.getElementById('shop-count');

            countEl.textContent = shops.length;
            listEl.innerHTML = '';

            if (shops.length === 0) {
                noDataEl.classList.remove('hidden');
                return;
            }
            noDataEl.classList.add('hidden');

            shops.forEach(shop => {
                const itayoObj = shop.itayo || {};
                const itayoCount = Object.keys(itayoObj).length;
                const hasItayo = Object.values(itayoObj).some(name => name === currentUserName);

                const card = document.createElement('div');
                card.className = "bg-dark-card border border-dark-border rounded-xl overflow-hidden shadow-md flex flex-col justify-between";
                
                let imageHtml = '';
                if (shop.imageUrl) {
                    imageHtml = `<div class="h-40 w-full overflow-hidden bg-dark-input"><img src="${shop.imageUrl}" class="w-full h-full object-cover hover:scale-105 transition duration-300" alt="${shop.name}"></div>`;
                } else {
                    imageHtml = `<div class="h-24 w-full bg-dark-input flex items-center justify-center text-dark-muted"><i class="fa-solid fa-utensils text-2xl opacity-40"></i></div>`;
                }

                card.innerHTML = `
                    <div>
                        ${imageHtml}
                        <div class="p-4 space-y-2">
                            <div class="flex justify-between items-start">
                                <div class="flex flex-wrap gap-1 items-center">
                                    <span class="text-[10px] bg-orange-500/20 text-orange-400 font-bold px-2 py-0.5 rounded border border-orange-500/30">${shop.genre || 'その他'}</span>
                                    <span class="text-[10px] bg-dark-input text-dark-muted px-2 py-0.5 rounded border border-dark-border"><i class="fa-solid fa-map-pin text-orange-400 mr-1"></i>${shop.pref || ''} ${shop.city || ''} (市区町村霧晴れ)</span>
                                </div>
                                <div class="flex space-x-1">
                                    <button onclick="openEditModal('${shop.id}')" class="text-dark-muted hover:text-white p-1 text-xs" title="編集"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteShop('${shop.id}')" class="text-dark-muted hover:text-red-400 p-1 text-xs" title="削除"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <h3 class="font-bold text-base text-gray-100">${escapeHtml(shop.name)}</h3>
                            ${shop.comment ? `<p class="text-xs text-dark-muted line-clamp-2">${escapeHtml(shop.comment)}</p>` : ''}
                            ${shop.url ? `<a href="${escapeHtml(shop.url)}" target="_blank" class="text-xs text-orange-400 hover:underline inline-flex items-center space-x-1 pt-1"><i class="fa-solid fa-external-link-alt text-[10px]"></i><span>外部サイト・マップへ</span></a>` : ''}
                        </div>
                    </div>
                    <div class="p-4 pt-0 border-t border-dark-border/40 mt-3 flex justify-between items-center bg-dark-card/50">
                        <span class="text-[11px] text-dark-muted">追加: ${shop.author || '不明'}</span>
                        <button onclick="toggleItayo('${shop.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 ${hasItayo ? 'bg-orange-500 text-white shadow-sm' : 'bg-dark-input hover:bg-dark-border text-dark-muted border border-dark-border'}">
                            <i class="fa-solid fa-check-circle"></i>
                            <span>イッタヨ！ (${itayoCount})</span>
                        </button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // ==========================================
        // 5. モーダル制御 & 保存処理
        // ==========================================
        function openSearchModal() { document.getElementById('search-modal').classList.remove('hidden'); }
        function closeSearchModal() { document.getElementById('search-modal').classList.add('hidden'); }

        function openAddModal() {
            document.getElementById('modal-title').textContent = 'お店を追加する';
            document.getElementById('edit-shop-id').value = '';
            document.getElementById('shop-name').value = '';
            document.getElementById('shop-genre').value = '和食';
            document.getElementById('shop-pref').value = '東京都';
            document.getElementById('shop-city').value = '';
            document.getElementById('shop-comment').value = '';
            document.getElementById('shop-url').value = '';
            document.getElementById('shop-image').value = '';
            document.getElementById('image-upload-progress').classList.add('hidden');
            document.getElementById('shop-modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const shop = allShops.find(s => s.id === id);
            if (!shop) return;
            document.getElementById('modal-title').textContent = 'お店を編集する';
            document.getElementById('edit-shop-id').value = shop.id;
            document.getElementById('shop-name').value = shop.name || '';
            document.getElementById('shop-genre').value = shop.genre || '和食';
            document.getElementById('shop-pref').value = shop.pref || '東京都';
            document.getElementById('shop-city').value = shop.city || '';
            document.getElementById('shop-comment').value = shop.comment || '';
            document.getElementById('shop-url').value = shop.url || '';
            document.getElementById('shop-image').value = '';
            document.getElementById('image-upload-progress').classList.add('hidden');
            document.getElementById('shop-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('shop-modal').classList.add('hidden'); }

        async function saveShop() {
            const id = document.getElementById('edit-shop-id').value;
            const name = document.getElementById('shop-name').value.trim();
            const genre = document.getElementById('shop-genre').value;
            const pref = document.getElementById('shop-pref').value;
            const city = document.getElementById('shop-city').value.trim();
            const comment = document.getElementById('shop-comment').value.trim();
            const url = document.getElementById('shop-url').value.trim();
            const imageFile = document.getElementById('shop-image').files[0];

            if (!name) {
                alert('店名を入力してください。');
                return;
            }
            if (!city) {
                alert('市区町村名を入力してください（細かい霧を晴らすため必須です）。');
                return;
            }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            document.getElementById('image-upload-progress').classList.remove('hidden');

            try {
                let imageUrl = '';
                if (id) {
                    const existing = allShops.find(s => s.id === id);
                    if (existing && existing.imageUrl) imageUrl = existing.imageUrl;
                }

                if (imageFile) {
                    const resizedBlob = await resizeImage(imageFile, 250, 250, 0.4);
                    imageUrl = await convertBlobToBase64(resizedBlob);
                }

                const shopData = {
                    name, genre, pref, city, comment, url, imageUrl,
                    author: currentUserName,
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                };

                const shopsRef = getDatabaseRef().ref('shops');
                if (id) {
                    await shopsRef.child(id).update(shopData);
                } else {
                    shopData.createdAt = firebase.database.ServerValue.TIMESTAMP;
                    await shopsRef.push(shopData);
                }

                closeModal();
            } catch (e) {
                console.error('詳細エラー:', e);
                alert('保存に失敗しました。\nエラー内容: ' + (e.message || e));
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '保存する';
                document.getElementById('image-upload-progress').classList.add('hidden');
            }
        }

        function deleteShop(id) {
            if (confirm('このお店の情報を削除してもよろしいですか？')) {
                getDatabaseRef().ref(`shops/${id}`).remove();
            }
        }

        // ==========================================
        // 6. 「イッタヨ！」機能
        // ==========================================
        function toggleItayo(shopId) {
            const shopRef = getDatabaseRef().ref(`shops/${shopId}/itayo`);
            shopRef.once('value', (snapshot) => {
                const itayoData = snapshot.val() || {};
                let userKeyToToggle = null;
                Object.keys(itayoData).forEach(key => {
                    if (itayoData[key] === currentUserName) userKeyToToggle = key;
                });
                if (userKeyToToggle) {
                    shopRef.child(userKeyToToggle).remove();
                } else {
                    shopRef.push(currentUserName);
                }
            });
        }

        // ==========================================
        // 7. ガチャ（ルーレット）機能
        // ==========================================
        function openRouletteModal() {
            if (allShops.length === 0) {
                alert('お店がまだ登録されていません。');
                return;
            }
            document.getElementById('roulette-modal').classList.remove('hidden');
            startRoulette();
        }

        function closeRouletteModal() { document.getElementById('roulette-modal').classList.add('hidden'); }

        function startRoulette() {
            const rouletteText = document.getElementById('roulette-text');
            const rouletteSub = document.getElementById('roulette-sub');
            const rouletteBtn = document.getElementById('roulette-btn');
            
            rouletteBtn.disabled = true;
            rouletteText.classList.add('slot-animation');

            let count = 0;
            const maxCount = 20;
            const timer = setInterval(() => {
                const randomShop = allShops[Math.floor(Math.random() * allShops.length)];
                rouletteText.textContent = randomShop.name;
                rouletteSub.textContent = `${randomShop.genre} / ${randomShop.pref} ${randomShop.city || ''}`;
                count++;

                if (count >= maxCount) {
                    clearInterval(timer);
                    rouletteText.classList.remove('slot-animation');
                    const finalShop = allShops[Math.floor(Math.random() * allShops.length)];
                    rouletteText.textContent = finalShop.name;
                    rouletteSub.textContent = `${finalShop.genre} / ${finalShop.pref} ${finalShop.city || ''} 🎉`;
                    rouletteBtn.disabled = false;
                }
            }, 80);
        }

        // ==========================================
        // 8. ユーティリティ（画像圧縮・Base64変換）
        // ==========================================
        function resizeImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => { 
                            if (blob) resolve(blob);
                            else reject(new Error('Blob creation failed'));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = (err) => reject(err);
                    img.src = e.target.result;
                };
                reader.onerror = (err) => reject(err);
                reader.readAsDataURL(file);
            });
        }

        function convertBlobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = (err) => reject(err);
                reader.readAsDataURL(blob);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`"<>]/g, (match) => {
                return { '&': '&amp;', QUOTE: '&#x27;', '`': '&#x60;', '"': '&quot;', '<': '&lt;', '>': '&gt;' }[match];
            });
        }
    </script>
