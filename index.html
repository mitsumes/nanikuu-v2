<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？ - 自分だけのグルメ手帳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1p:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1p', sans-serif;
            background-color: #f7fee7;
        }
        .leaflet-container {
            width: 100%;
            height: 100%;
            border-radius: 1.5rem;
        }
        .modal {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        @keyframes shine {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .medal-shine {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shine 3s infinite;
        }
    </style>
</head>
<body class="text-slate-700 flex flex-col min-h-screen">

    <!-- ヘッダー -->
    <header class="bg-emerald-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-2">
                <span class="bg-white text-emerald-600 p-2 rounded-full shadow-md text-xl"><i class="fa-solid fa-utensils"></i></span>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide">なにクウ？</h1>
                    <p class="text-xs text-emerald-100">自分だけのグルメ手帳 & 開拓マップ</p>
                </div>
            </div>
            <!-- コンプリートカウンター -->
            <div class="bg-emerald-700/80 px-3 py-1.5 rounded-xl border border-emerald-500/50 text-xs sm:text-sm flex items-center gap-2 shadow-inner">
                <i class="fa-solid fa-flag text-yellow-300"></i>
                <span>全国制覇まであと: <strong id="header-remaining" class="text-yellow-300 font-bold">1,718</strong> 市町村</span>
            </div>
            <nav class="flex space-x-1 sm:space-x-2">
                <button onclick="switchTab('map')" id="btn-tab-map" class="px-3 py-1.5 rounded-xl text-sm font-bold bg-white text-emerald-700 shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-map"></i> マップ
                </button>
                <button onclick="switchTab('badges')" id="btn-tab-badges" class="px-3 py-1.5 rounded-xl text-sm font-bold bg-emerald-700 hover:bg-emerald-500 text-white transition flex items-center gap-1.5">
                    <i class="fa-solid fa-medal"></i> 図鑑
                </button>
                <button onclick="switchTab('gacha')" id="btn-tab-gacha" class="px-3 py-1.5 rounded-xl text-sm font-bold bg-emerald-700 hover:bg-emerald-500 text-white transition flex items-center gap-1.5">
                    <i class="fa-solid fa-dice"></i> ガチャ
                </button>
            </nav>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-3 sm:p-4 flex flex-col">

        <!-- マップタブ -->
        <section id="tab-map" class="space-y-4 flex flex-col flex-grow">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-emerald-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-cloud-sun text-emerald-500"></i> エリア開拓状況
                    </h2>
                    <p class="text-xs text-slate-500">お店を登録すると周辺1kmが円で開拓され、名産物メダルが手に入ります！</p>
                </div>
                <button onclick="openAddModal()" class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-2xl shadow-md transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> お店を登録する
                </button>
            </div>

            <!-- マップ表示エリア -->
            <div class="relative w-full h-[400px] sm:h-[500px] rounded-3xl shadow-md border-4 border-white overflow-hidden bg-slate-100">
                <div id="map"></div>
            </div>

            <!-- 登録店舗リスト（直近） -->
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-emerald-100">
                <h3 class="font-bold text-sm text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-list-ul text-emerald-500"></i> 最近開拓したお店
                </h3>
                <div id="recent-shops-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    <!-- 動的に挿入 -->
                </div>
            </div>
        </section>

        <!-- バッチ・名産物メダル図鑑タブ -->
        <section id="tab-badges" class="space-y-4 hidden">
            <div class="bg-gradient-to-r from-amber-500 to-yellow-500 text-white p-6 rounded-3xl shadow-md flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h2 class="text-xl font-extrabold flex items-center gap-2">
                        <i class="fa-solid fa-award"></i> 市町村・名産物メダル図鑑
                    </h2>
                    <p class="text-xs text-amber-100 mt-1">全国1,718市町村の名産物メダルを集めよう！</p>
                </div>
                <div class="bg-black/20 px-4 py-2 rounded-2xl text-center backdrop-blur-sm">
                    <div class="text-xs text-amber-100">コレクション状況</div>
                    <div class="text-2xl font-black" id="badge-count-text">0 / 1,718 <span class="text-xs font-normal">市区町村</span></div>
                </div>
            </div>

            <!-- メダル一覧グリッド -->
            <div id="badges-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- 動的に挿入 -->
            </div>
        </section>

        <!-- おまかせランチガチャタブ -->
        <section id="tab-gacha" class="space-y-4 hidden flex-grow flex flex-col justify-center items-center py-6">
            <div class="bg-white p-8 rounded-3xl shadow-md border border-emerald-100 text-center max-w-md w-full space-y-6">
                <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">
                    <i class="fa-solid fa-utensils animate-bounce"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-black text-slate-800">おまかせランチガチャ</h2>
                    <p class="text-xs text-slate-500 mt-1">どこに行くか迷ったら、登録したお店からランダムで決定！</p>
                </div>
                <div id="gacha-result" class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 min-h-[90px] flex flex-col justify-center items-center">
                    <span class="text-sm text-emerald-700 font-bold">ボタンを押してルーレットを回そう！</span>
                </div>
                <button onclick="spinGacha()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-extrabold py-3.5 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-lg">
                    <i class="fa-solid fa-dice"></i> ガチャを回す！
                </button>
            </div>
        </section>

    </main>

    <!-- お店登録モーダル -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden modal">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-emerald-100 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-extrabold text-lg text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-map-pin text-emerald-500"></i> 新しいお店を登録
                </h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="shop-form" onsubmit="handleShopSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">店名</label>
                    <input type="text" id="shop-name" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="例：ひつまぶし名古屋 太郎">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">都道府県</label>
                        <input type="text" id="shop-pref" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="例：愛知県">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">市区町村</label>
                        <input type="text" id="shop-city" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="例：名古屋市">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">名産物（メダルのモチーフ）</label>
                    <input type="text" id="shop-specialty" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="例：ひつまぶし / みそカツ">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">緯度 (Latitude)</label>
                        <input type="number" step="any" id="shop-lat" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="例：35.1815">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">経度 (Longitude)</label>
                        <input type="number" step="any" id="shop-lng" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="例：136.9066">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">メモ・感想</label>
                    <textarea id="shop-memo" rows="2" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="美味しかった！"></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md transition mt-2">
                    登録して開拓する！
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        const TOTAL_MUNICIPALITIES = 1718;

        let shops = JSON.parse(localStorage.getItem('naniku_shops')) || [
            {
                id: 1,
                name: "うなぎのたろう",
                pref: "愛知県",
                city: "名古屋市",
                specialty: "ひつまぶし",
                lat: 35.1815,
                lng: 136.9066,
                memo: "香ばしくて最高でした！",
                date: "2026-06-01"
            }
        ];

        let map, exploredLayers = [];

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            renderAll();
        });

        // タブ切り替え（修正済）
        function switchTab(tabName) {
            ['map', 'badges', 'gacha'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const btn = document.getElementById(`btn-tab-${t}`);
                if (el) el.classList.add('hidden');
                if (btn) {
                    btn.className = "px-3 py-1.5 rounded-xl text-sm font-bold bg-emerald-700 hover:bg-emerald-500 text-white transition flex items-center gap-1.5";
                }
            });
            
            const targetTab = document.getElementById(`tab-${tabName}`);
            const targetBtn = document.getElementById(`btn-tab-${tabName}`);
            if (targetTab) targetTab.classList.remove('hidden');
            if (targetBtn) {
                targetBtn.className = "px-3 py-1.5 rounded-xl text-sm font-bold bg-white text-emerald-700 shadow transition flex items-center gap-1.5";
            }

            if (tabName === 'map' && map) {
                setTimeout(() => map.invalidateSize(), 200);
            }
        }

        function initMap() {
            map = L.map('map').setView([35.1815, 136.9066], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            updateMapLayers();
        }

        function updateMapLayers() {
            if (!map) return;
            exploredLayers.forEach(layer => map.removeLayer(layer));
            exploredLayers = [];

            shops.forEach(shop => {
                const circle = L.circle([shop.lat, shop.lng], {
                    color: '#10b981',
                    fillColor: '#34d399',
                    fillOpacity: 0.3,
                    radius: 1000
                }).addTo(map);
                exploredLayers.push(circle);

                const marker = L.marker([shop.lat, shop.lng]).addTo(map);
                marker.bindPopup(`
                    <div class="p-1">
                        <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">${shop.pref} ${shop.city}</span>
                        <h4 class="font-bold text-sm mt-1">${shop.name}</h4>
                        <p class="text-xs text-slate-500 mt-0.5">名産物: <b>${shop.specialty}</b></p>
                        <p class="text-xs text-slate-600 mt-1">${shop.memo || ''}</p>
                    </div>
                `);
                exploredLayers.push(marker);
            });
        }

        function renderAll() {
            localStorage.setItem('naniku_shops', JSON.stringify(shops));
            updateMapLayers();
            renderRecentShops();
            renderBadges();
            updateCounters();
        }

        function updateCounters() {
            const uniqueCities = new Set(shops.map(s => `${s.pref}-${s.city}`)).size;
            const remaining = Math.max(0, TOTAL_MUNICIPALITIES - uniqueCities);

            document.getElementById('header-remaining').innerText = remaining.toLocaleString();
            document.getElementById('badge-count-text').innerHTML = `${uniqueCities.toLocaleString()} / ${TOTAL_MUNICIPALITIES.toLocaleString()} <span class="text-xs font-normal">市区町村</span>`;
        }

        function renderRecentShops() {
            const container = document.getElementById('recent-shops-list');
            container.innerHTML = '';
            
            if (shops.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 col-span-full text-center py-4">まだお店が登録されていません。</p>`;
                return;
            }

            [...shops].reverse().slice(0, 6).forEach(shop => {
                const card = document.createElement('div');
                card.className = "bg-emerald-50/50 border border-emerald-100 p-3 rounded-2xl flex flex-col justify-between shadow-xs";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-1">
                            <span class="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded-full font-bold">${shop.pref} ${shop.city}</span>
                            <span class="text-[10px] text-slate-400">${shop.date || ''}</span>
                        </div>
                        <h4 class="font-bold text-sm text-slate-800 mt-1.5">${shop.name}</h4>
                        <p class="text-xs text-emerald-700 font-semibold mt-0.5"><i class="fa-solid fa-award"></i> メダルモチーフ: ${shop.specialty}</p>
                    </div>
                    ${shop.memo ? `<p class="text-xs text-slate-500 mt-2 bg-white p-2 rounded-xl border border-slate-100 italic">"${shop.memo}"</p>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function renderBadges() {
            const grid = document.getElementById('badges-grid');
            grid.innerHTML = '';

            const cityMap = {};
            shops.forEach(shop => {
                const key = `${shop.pref} ${shop.city}`;
                if (!cityMap[key]) cityMap[key] = shop;
            });

            const uniqueCityKeys = Object.keys(cityMap);

            if (uniqueCityKeys.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 text-sm">お店を登録して名産物メダルを獲得しよう！</div>`;
                return;
            }

            uniqueCityKeys.forEach(key => {
                const shop = cityMap[key];
                const card = document.createElement('div');
                card.className = "bg-white border-2 border-amber-200 p-4 rounded-3xl shadow-sm text-center relative overflow-hidden flex flex-col items-center justify-between group hover:shadow-md transition";
                card.innerHTML = `
                    <div class="absolute inset-0 medal-shine opacity-30 pointer-events-none"></div>
                    <div>
                        <span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full">${shop.pref}</span>
                        <h4 class="font-extrabold text-sm text-slate-800 mt-1">${shop.city}</h4>
                    </div>
                    <div class="my-3 relative">
                        <div class="w-16 h-16 bg-gradient-to-tr from-amber-400 via-yellow-300 to-amber-500 rounded-full flex items-center justify-center shadow-md mx-auto border-4 border-amber-100 text-white text-2xl group-hover:scale-105 transition transform">
                            <i class="fa-solid fa-medal drop-shadow"></i>
                        </div>
                        <div class="absolute -bottom-1 -right-1 bg-emerald-600 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold shadow">
                            ★特産
                        </div>
                    </div>
                    <div class="w-full bg-amber-50 p-2 rounded-2xl border border-amber-100">
                        <p class="text-[10px] text-amber-900 font-bold">名産メダル</p>
                        <p class="text-xs font-extrabold text-slate-700 truncate">${shop.specialty}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function spinGacha() {
            const resultBox = document.getElementById('gacha-result');
            if (shops.length === 0) {
                resultBox.innerHTML = `<span class="text-xs text-red-500 font-bold">お店が登録されていません。</span>`;
                return;
            }

            resultBox.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xl text-emerald-600"></i><span class="text-xs text-slate-500 mt-1">選定中...</span>`;

            setTimeout(() => {
                const picked = shops[Math.floor(Math.random() * shops.length)];
                resultBox.innerHTML = `
                    <span class="text-xs text-emerald-600 font-bold">${picked.pref} ${picked.city}</span>
                    <h4 class="text-base font-black text-slate-800 mt-0.5">${picked.name}</h4>
                    <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold mt-1">おすすめ名産: ${picked.specialty}</span>
                `;
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
                }
            }, 600);
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('shop-lat').value = (35.1815 + (Math.random() - 0.5) * 0.05).toFixed(4);
            document.getElementById('shop-lng').value = (136.9066 + (Math.random() - 0.5) * 0.05).toFixed(4);
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
        }

        function handleShopSubmit(e) {
            e.preventDefault();
            const newShop = {
                id: Date.now(),
                name: document.getElementById('shop-name').value,
                pref: document.getElementById('shop-pref').value,
                city: document.getElementById('shop-city').value,
                specialty: document.getElementById('shop-specialty').value,
                lat: parseFloat(document.getElementById('shop-lat').value),
                lng: parseFloat(document.getElementById('shop-lng').value),
                memo: document.getElementById('shop-memo').value,
                date: new Date().toISOString().split('T')[0]
            };

            shops.push(newShop);
            renderAll();
            closeAddModal();
            document.getElementById('shop-form').reset();

            if (typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.5 } });
            }

            switchTab('map');
            if (map) map.setView([newShop.lat, newShop.lng], 14);
        }
    </script>
</body>
</html>
